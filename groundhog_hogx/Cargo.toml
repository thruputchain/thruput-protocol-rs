[package]
name = "groundhog_hogx"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["rlib"]

[features]
default = ["alloc", "std", "xdrs"]
alloc = ["xdrs", "xdrs/alloc"]
std = ["alloc"]
xdrs = []
spec = [] # enable dump of XDR specs
serde = [
    "dep:serde",
    "dep:serde_arrays",
    "dep:serde_with",
    "xdrs/serde",
    "groundhog_scp/serde",
    "groundhog-xdr/serde",
    "groundhog_coordinator/serde",
]

[dependencies]
async-trait = "0.1.89"

[dependencies.serde]
optional = true
version = "1.0.219"
default-features = false
features = ["derive"]

[dependencies.serde_arrays]
optional = true
git = "ssh://git@github.com/groundhogchain/serde_arrays.git"
default-features = false

[dependencies.serde_with]
workspace = true
optional = true
features = []

[dependencies.groundhog_scp]
path = "../groundhog_scp"
features = ["std", "xdrs"]

[dependencies.groundhog-xdr]
path = "../groundhog-xdr"
features = ["std", "xdrs"]

[dependencies.groundhog_coordinator]
path = "../groundhog_coordinator"
features = ["std", "xdrs"]

[dependencies.xdrs]
workspace = true
features = ["derive", "int128_xdr", "ns", "alloc"]

[dependencies.rpc_driver]
workspace = true
