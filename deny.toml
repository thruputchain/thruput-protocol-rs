# cargo-deny configuration
#   (advisory, license, source, and duplicate-version policy)
#
#   https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
ignore = []
# Informational advisories (unsound, unmaintained) default to workspace-direct
# dependencies only.
unsound = "all"
unmaintained = "all"
# Inert while we fetch every run; matters only if the DB is cached or
# --offline is used. Default bound is 90 days; measured from the last fetch.
maximum-db-staleness = "P7D"

[licenses]
private = { ignore = true }
allow = [
    "Apache-2.0",
    "MIT",
    # wasi: not implied by the bare Apache-2.0 above.
    "Apache-2.0 WITH LLVM-exception",
    # ryu, dual-licensed Apache-2.0 OR BSL-1.0
    "BSL-1.0",
    # unicode-ident is (MIT OR Apache-2.0) AND Unicode-3.0
    "Unicode-3.0",
    # memchr, dual-licensed Unlicense OR MIT
    "Unlicense",
    # encoding_rs (via serde-saphyr) is (Apache-2.0 OR MIT) AND BSD-3-Clause
    "BSD-3-Clause",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Internal path dependencies carry no version requirement. Registry wildcards
# stay denied.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = [
    "https://github.com/rust-lang/crates.io-index",
]
