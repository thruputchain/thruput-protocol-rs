[package]
name = "thruput-exec-internal"
version.workspace = true
rust-version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description = "FFI enums shared with the Thruput executor: invocation, host-function and system error codes"

# docs.rs builds the default features only; document the whole API.
[package.metadata.docs.rs]
all-features = true

[lib]
crate-type = ["rlib"]

[features]
default = []
alloc = ["xdrs/alloc"]
std = ["alloc"]
xdrs = []

[dependencies.xdrs]
workspace = true
features = ["derive"]
