[package]
name = "groundhog_xdr"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["rlib"]

[features]
default = []
alloc = ["serde/alloc", "serde_arrays/alloc", "xdrs/alloc"]
std = ["alloc", "xdrs"]
serde = ["dep:serde", "dep:serde_arrays"]
xdrs = []

[dependencies.xdrs]
git = "ssh://git@github.com/groundhogchain/xdrs.git"
branch = "dbg/repr"
features = ["derive", "alloc", "xdr_common"]

[dependencies.serde]
optional = true
version = "1.0.219"
default-features = false
features = ["derive"]

[dependencies.serde_arrays]
optional = true
path = "../external/serde_arrays"
default-features = false
