[package]
name = "groundhog_xdr"
version.workspace = true
edition.workspace = true

[lib]
crate-type = ["rlib"]

[features]
default = []
std = ["alloc"]
alloc = ["serde?/alloc", "serde_arrays?/alloc", "xdrs?/alloc"]

xdrs = ["dep:xdrs"]
spec = ["xdrs", "xdrs/repr"]
serde = ["dep:serde", "dep:serde_arrays"]
syscalls = ["dep:macros", "dep:thiserror"]
syscalls_mock = ["syscalls"] # required for native_exec integration

[dependencies]
xdr_common.workspace = true

# Optional dependencies

[dependencies.xdrs]
workspace = true
features = ["derive", "xdr_common", "extras", "int128_xdr"]
optional = true

[dependencies.serde]
version = "1.0.219"
default-features = false
features = ["derive"]
optional = true

[dependencies.serde_arrays]
git = "ssh://git@github.com/groundhogchain/serde_arrays.git"
default-features = false
optional = true

[dependencies.macros]
path = "../macros"
optional = true

[dependencies.thiserror]
version = "2.0.16"
default-features = false
optional = true
