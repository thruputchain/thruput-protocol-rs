[package]
name = "groundhog_xdr"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["rlib"]

[features]
alloc = []
std = ["alloc"]

[dependencies]
protocol_macros = { path = "../protocol_macros" }

[dependencies.serde]
version = "1.0.219"
default-features = false
features = ["alloc", "derive"]

[dependencies.serde_arrays]
path = "../external/serde_arrays"
default-features = false
features = ["alloc"]
