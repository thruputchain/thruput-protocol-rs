[package]
name = "groundhog_xdr"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["rlib"]

[features]
default = []
alloc = ["serde/alloc", "serde_arrays/alloc", "xdrs/alloc"]
std = ["alloc"]
serde = ["dep:serde", "dep:serde_arrays"]
xdrs = []
spec = ["xdrs", "xdrs/repr"]
rpc = ["dep:rpc_driver"]

[dependencies.xdrs]
workspace = true
features = ["derive", "xdr_common"]

[dependencies.xdr_common]
workspace = true

[dependencies.rpc_driver]
workspace = true
optional = true

[dependencies.serde]
optional = true
version = "1.0.219"
default-features = false
features = ["derive"]

[dependencies.serde_arrays]
optional = true
path = "../external/serde_arrays"
default-features = false
