[package]
name = "groundhog_xdr"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["rlib"]

[features]
default = []
alloc = ["serde/alloc", "serde_arrays/alloc"]
std = ["alloc"]

[dependencies]
protocol_macros = { path = "../protocol_macros" }
ciborium = { version = "0.2.2", default-features = false }

[dependencies.serde]
version = "1.0.219"
default-features = false
features = ["derive"]

[dependencies.serde_arrays]
path = "../external/serde_arrays"
default-features = false
