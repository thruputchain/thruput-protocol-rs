[package]
name = "groundhog_xdr"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["rlib"]

[features]
default = []
alloc = ["serde/alloc", "serde_arrays/alloc", "xdrs/alloc"]
std = ["alloc"]
serde = ["dep:serde", "dep:serde_arrays"]

[dependencies]
protocol_macros = { path = "../protocol_macros" }
xdrs = { workspace = true, features = ["derive"] }

[dependencies.serde]
optional = true
version = "1.0.219"
default-features = false
features = ["derive"]

[dependencies.serde_arrays]
optional = true
path = "../external/serde_arrays"
default-features = false
