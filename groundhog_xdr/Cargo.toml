[package]
name = "groundhog_xdr"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["rlib"]

[features]
default = []
alloc = ["serde/alloc", "serde_arrays/alloc", "xdrs/alloc"]
std = ["alloc"]
serde = ["dep:serde", "dep:serde_arrays"]

[dependencies]
xdr_common = { git = "ssh://git@github.com/groundhogchain/xdr_common.git" }

[dependencies.xdrs]
git = "ssh://git@github.com/groundhogchain/xdrs.git"
features = ["derive", "cxs", "txs", "strict"]

[dependencies.serde]
optional = true
version = "1.0.219"
default-features = false
features = ["derive"]

[dependencies.serde_arrays]
optional = true
path = "../external/serde_arrays"
default-features = false
