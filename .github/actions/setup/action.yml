name: "Prepare Environment"
description: "Prepare the environment"
runs:
  using: "composite"
  steps:
    - name: Add Cargo to PATH
      run: echo "$HOME/.cargo/bin" >> $GITHUB_PATH
      shell: bash
    - name: path check
      run: echo $PATH
      shell: bash
    - name: cargo version check
      run: cargo --version
      shell: bash
    - name: cargo clean
      run: cargo clean
      shell: bash