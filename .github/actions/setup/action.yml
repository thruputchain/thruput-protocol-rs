name: "Prepare Environment"
description: "Prepare the environment"
runs:
  using: "composite"
  steps:
    - name: Add Cargo to PATH
      # The github-env audit exists for GITHUB_PATH writes whose *content* an
      # attacker can influence, under a dangerous trigger such as
      # pull_request_target or workflow_run. Neither applies: the value is the
      # literal "$HOME/.cargo/bin", and no workflow here uses such a trigger.
      # zizmor flags it anyway because a composite action is audited alone.
      run: echo "$HOME/.cargo/bin" >> $GITHUB_PATH # zizmor: ignore[github-env]
      shell: bash
    - name: path check
      run: echo $PATH
      shell: bash
    - name: cargo version check
      run: cargo --version
      shell: bash
    - name: cargo clean
      run: cargo clean
      shell: bash