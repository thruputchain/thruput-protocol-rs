name: Audit

on:
  schedule:
    - cron: '45 8 * * *' # daily at 08:45 UTC
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  scan:
    permissions:
      contents: read
    uses: thruputchain/actions/.github/workflows/rust-dependency-policy.yml@3e0d08d054591a349331ab57fe72197d6ccc0cf3
    with:
      checks: advisories

  notify:
    needs: scan
    if: failure()
    permissions:
      contents: read
      issues: write # files the advisory issue
    uses: thruputchain/actions/.github/workflows/rust-advisory-issue.yml@3e0d08d054591a349331ab57fe72197d6ccc0cf3
