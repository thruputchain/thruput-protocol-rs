name: Nightly release

on:
  schedule:
    - cron: '0 9 * * *'   # 05:00 EDT / 02:00 PDT
  workflow_dispatch:

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  # Plain Cargo calls in the dry-run action need registry authentication too.
  CARGO_REGISTRIES_THRUPUT_TOKEN: ${{ secrets.GROUNDHOG_REGISTRY_TOKEN }}
  CARGO_REGISTRY_GLOBAL_CREDENTIAL_PROVIDERS: cargo:token

permissions:
  contents: read

jobs:
  nightly:
    permissions:
      contents: write # force-pushes the nightly tag
    runs-on: namespace-profile-hogd-linux-2604

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install rustup if needed
        run: |
          if ! command -v rustup >/dev/null 2>&1; then
            CARGO_HOME="${CARGO_HOME:-$HOME/.cargo}"
            curl --proto '=https' --tlsv1.2 --retry 10 --retry-connrefused \
              --location --silent --show-error --fail https://sh.rustup.rs \
              | sh -s -- --default-toolchain none --profile minimal -y
            echo "CARGO_HOME=$CARGO_HOME" >> "$GITHUB_ENV"
            echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"
          fi
      - name: Set up Rust 1.96
        run: |
          rustup toolchain install 1.96.0 --profile minimal --component clippy,rustfmt --target riscv32im-unknown-none-elf --no-self-update
          rustup default 1.96.0
      - name: Set up dated nightly for rustdoc and rustfmt
        run: |
          rustup toolchain install nightly-2026-05-26 --profile minimal --component rustfmt --no-self-update
          rustup default nightly-2026-05-26
      - name: Install cargo-hack
        env:
          CARGO_HACK_VERSION: '0.6.45'
        run: |
          source "$HOME/.cargo/env"
          if [ "$(cargo hack --version 2>/dev/null | awk '{print $2}')" != "$CARGO_HACK_VERSION" ]; then
            cargo install cargo-hack --version "=$CARGO_HACK_VERSION" --locked
          fi
          cargo hack --version

      - name: Check for changes since last nightly
        id: changed
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          HEAD_SHA=$(git rev-parse HEAD)
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          # Matching refs returns an empty list on the first run. Auth or
          # network failures still fail the job instead of forcing publication.
          REMOTE_SHA=$(gh api "repos/$REPOSITORY/git/matching-refs/tags/nightly" \
            --jq 'map(select(.ref == "refs/tags/nightly")) | .[0].object.sha // ""')
          if [ -n "$REMOTE_SHA" ] && [ "$REMOTE_SHA" = "$HEAD_SHA" ]; then
            echo "main unchanged since last nightly ($HEAD_SHA); skipping publish and tag re-push."
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute nightly version
        if: steps.changed.outputs.should_publish == 'true'
        id: version
        uses: thruputchain/actions/cargo-nightly-version@6693fac8133585728ad3a4ca14e3441073b6def8
        with:
          commit: 'true'

      - name: dry run
        if: steps.changed.outputs.should_publish == 'true'
        uses: thruputchain/actions/cargo-publish-dry-run@6693fac8133585728ad3a4ca14e3441073b6def8
        with:
          registry-name: thruput
          skip-clippy: true
          cargo-hack-feature-options: '--feature-powerset --group-features syscalls,syscalls_mock --ignore-unknown-features'

      - name: publish prerelease
        if: steps.changed.outputs.should_publish == 'true'
        uses: thruputchain/actions/cargo-publish-prerelease@6693fac8133585728ad3a4ca14e3441073b6def8
        with:
          registry-name: thruput
          registry-token: ${{ secrets.GROUNDHOG_REGISTRY_TOKEN }}
          no-verify: 'true'

      - name: Move nightly tag
        if: steps.changed.outputs.should_publish == 'true'
        env:
          BASE_SHA: ${{ steps.changed.outputs.head_sha }}
          VERSION: ${{ steps.version.outputs.version }}
          ACTOR: ${{ github.actor }}
          TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Tag the ORIGINAL pre-bump commit (captured before the ephemeral local
          # version commit), which is the commit actually on the remote.
          echo "Tagging $BASE_SHA as nightly $VERSION"
          git tag -f nightly "$BASE_SHA"
          git remote set-url origin "https://$ACTOR:$TOKEN@github.com/$REPOSITORY.git"
          git push -f origin refs/tags/nightly
          git remote set-url origin "git@github.com:$REPOSITORY.git"
