name: Auto-update protocol

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: auto-update-protocol
  cancel-in-progress: true

jobs:
  update:
    permissions:
      contents: write # pushes the auto-update branch
      pull-requests: write # opens/merges the PR
    runs-on: namespace-profile-hogd-linux-2604
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The push below uses this key.
          persist-credentials: true
          ssh-key: ${{ secrets.PROT_RS_WRITE_KEY }}

      - name: Update protocol submodule to latest main
        run: |
          git submodule update --init protocol
          git -C protocol fetch origin main
          git -C protocol checkout origin/main

      - name: Regenerate
        run: ./scripts/generate.sh

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Protocol submodule already up to date."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and open PR
        if: steps.diff.outputs.changed == 'true'
        run: |
          PROTOCOL_SHA=$(git -C protocol rev-parse --short=7 HEAD)
          BRANCH="auto-update/protocol"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin git@github.com:thruputchain/thruput-protocol-rs.git

          git checkout -b "$BRANCH"
          git add -A
          git commit -m "bump to protocol@${PROTOCOL_SHA}"
          git push -f -u origin "$BRANCH"

          EXISTING_PR=$(gh pr list --head "$BRANCH" --state open --json url --jq '.[0].url')
          if [ -n "$EXISTING_PR" ]; then
            echo "Updated existing PR: $EXISTING_PR"
            gh pr merge "$EXISTING_PR" --auto --squash
          else
            PR_URL=$(gh pr create \
              --title "Auto-update protocol to ${PROTOCOL_SHA}" \
              --body "Automated protocol submodule bump and regeneration.

          Protocol: thruputchain/thruput-protocol@${PROTOCOL_SHA}")
            gh pr merge "$PR_URL" --auto --squash
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
