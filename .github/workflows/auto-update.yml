name: Auto-update protocol

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: auto-update-protocol
  cancel-in-progress: true

jobs:
  update:
    permissions:
      contents: write # pushes the auto-update branch
      pull-requests: write # opens/merges the PR
    runs-on: namespace-profile-hogd-linux-2604
    steps:
      - name: Generate hogd read token
        id: hogd-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.PROTOCOL_SYNCHRONIZER_APP_ID }}
          private-key: ${{ secrets.PROTOCOL_SYNCHRONIZER_SECRET_KEY }}
          owner: thruputchain
          repositories: hogd
          # Without this the token inherits every permission the installation
          # holds on hogd; the step only downloads a release asset.
          permission-contents: read

      - name: Setup SSH Agent
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: |
            ${{ secrets.PROTOCOL_RS_GH_ACTIONS_PROTOCOL_ACCESS_KEY }}
            ${{ secrets.PROT_RS_WRITE_KEY }}

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          submodules: recursive
          # The push below uses this key.
          persist-credentials: true
          ssh-key: ${{ secrets.PROT_RS_WRITE_KEY }}

      - name: Update protocol submodule to latest main
        run: |
          git -C protocol fetch origin main
          git -C protocol checkout origin/main

      - name: Download x23c
        run: |
          gh release download latest-x23c \
            --repo thruputchain/hogd \
            --pattern 'x23c-linux-x86_64.tar.gz'
          tar xzf x23c-linux-x86_64.tar.gz
          chmod +x x23c
        env:
          GH_TOKEN: ${{ steps.hogd-token.outputs.token }}

      - name: Regenerate
        run: XDRC=./x23c ./scripts/generate.sh

      - name: Check for changes
        id: diff
        run: |
          rm -f x23c x23c-linux-x86_64.tar.gz
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Protocol submodule already up to date."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and open PR
        if: steps.diff.outputs.changed == 'true'
        run: |
          PROTOCOL_SHA=$(git -C protocol rev-parse --short=7 HEAD)
          BRANCH="auto-update/protocol"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin git@github.com:thruputchain/thruput-protocol-rs.git

          git checkout -b "$BRANCH"
          git add -A
          git commit -m "bump to protocol@${PROTOCOL_SHA}"
          git push -f -u origin "$BRANCH"

          EXISTING_PR=$(gh pr list --head "$BRANCH" --state open --json url --jq '.[0].url')
          if [ -n "$EXISTING_PR" ]; then
            echo "Updated existing PR: $EXISTING_PR"
            gh pr merge "$EXISTING_PR" --auto --squash
          else
            PR_URL=$(gh pr create \
              --title "Auto-update protocol to ${PROTOCOL_SHA}" \
              --body "Automated protocol submodule bump and regeneration.

          Protocol: thruputchain/thruput-protocol@${PROTOCOL_SHA}")
            gh pr merge "$PR_URL" --auto --squash
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
