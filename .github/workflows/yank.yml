name: Yank package

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to yank (e.g. 0.24.1)'
        required: true
        type: string
      undo:
        description: 'Un-yank (restore) instead of yank'
        required: false
        type: boolean
        default: false

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

permissions:
  contents: read

jobs:
  yank:
    permissions:
      contents: read
    runs-on: hog1

    steps:
      - name: Clean up .gitconfig
        run: |
            echo "Cleaning up .gitconfig"
            rm -f /home/hogci/.gitconfig

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: yank
        uses: thruputchain/actions/cargo-yank@6693fac8133585728ad3a4ca14e3441073b6def8
        with:
          version: ${{ inputs.version }}
          undo: ${{ inputs.undo }}
          registry-name: thruput
          registry-token: ${{ secrets.GROUNDHOG_REGISTRY_TOKEN }}
