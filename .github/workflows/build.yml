# .github/workflows/build.yml
name: Build

on:
  push:
    branches: [ "main" ]  
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: self-hosted

    steps:
      - name: Clean up .gitconfig
        run: |
          echo "Cleaning up .gitconfig"
          rm -f /home/hogci/.gitconfig
      - uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: |
            ${{ secrets.PROTOCOL_RS_GH_ACTIONS_PROTOCOL_ACCESS_KEY }}
            ${{ secrets.PROTOCOL_RS_GH_ACTIONS_SERDE_ARRAYS_KEY }}
            ${{ secrets.PROTOCOL_RS_SELF_ACCESS_KEY }}
            ${{ secrets.PROTOCOL_RS_TO_XDRS_ACCESS_KEY }}
            ${{ secrets.PROTOCOL_RS_TO_XDR_COMMON }}
            ${{ secrets.PROTOCOL_RS_TO_XDR_RPC }}
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Add Cargo to PATH
        run: echo "$HOME/.cargo/bin" >> $GITHUB_PATH
      - name: cargo build default
        run: CARGO_NET_GIT_FETCH_WITH_CLI=true cargo -p groundhog_xdr build --verbose
      - name: cargo build alloc
        run: CARGO_NET_GIT_FETCH_WITH_CLI=true cargo -p groundhog_xdr build --verbose --features=alloc
      - name: cargo build std
        run: CARGO_NET_GIT_FETCH_WITH_CLI=true cargo -p groundhog_xdr build --verbose --features=std
      - name: cargo build xdrs
        run: CARGO_NET_GIT_FETCH_WITH_CLI=true cargo -p groundhog_xdr build --verbose --features=xdrs
      - name: cargo build syscalls
        run: CARGO_NET_GIT_FETCH_WITH_CLI=true cargo -p groundhog_xdr build --verbose --features=xdrs,syscalls
      - name: cargo build syscalls mock
        run: CARGO_NET_GIT_FETCH_WITH_CLI=true cargo -p groundhog_xdr build --verbose --features=xdrs,syscalls_mock
      - name: run tests
        run: CARGO_NET_GIT_FETCH_WITH_CLI=true cargo -p groundhog_xdr test --features=std
      - name: build rpc
        run: CARGO_NET_GIT_FETCH_WITH_CLI=true cargo -p groundhog_rpc build --verbose
      - name: build scp
        run: CARGO_NET_GIT_FETCH_WITH_CLI=true cargo -p groundhog_scp build --verbose
      - name: format checks
        run: CARGO_NET_GIT_FETCH_WITH_CLI=true cargo fmt --check
