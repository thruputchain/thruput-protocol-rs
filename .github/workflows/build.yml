# .github/workflows/build.yml
name: Build

on:
  push:
    branches: [ "main" ]  
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: self-hosted

    steps:
      - name: Clean up .gitconfig
        run: |
          echo "Cleaning up .gitconfig"
          rm -f /home/hogci/.gitconfig
      - uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: |
            ${{ secrets.PROTOCOL_RS_GH_ACTIONS_PROTOCOL_ACCESS_KEY }}
            ${{ secrets.PROTOCOL_RS_GH_ACTIONS_SERDE_ARRAYS_KEY }}
            ${{ secrets.PROTOCOL_RS_SELF_ACCESS_KEY }}
            ${{ secrets.PROTOCOL_RS_TO_XDRS_ACCESS_KEY }}
            ${{ secrets.PROTOCOL_RS_TO_XDR_COMMON }}
            ${{ secrets.PROTOCOL_RS_TO_XDR_RPC }}
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Setup environment
        uses: ./.github/actions/setup
      - name: cargo build default
        run: CARGO_NET_GIT_FETCH_WITH_CLI=true cargo build -v -p groundhog_xdr
      - name: cargo build alloc
        run: CARGO_NET_GIT_FETCH_WITH_CLI=true cargo build -v -p groundhog_xdr --features=alloc
      - name: cargo build std
        run: CARGO_NET_GIT_FETCH_WITH_CLI=true cargo build -v -p groundhog_xdr --features=std
      - name: cargo build xdrs
        run: CARGO_NET_GIT_FETCH_WITH_CLI=true cargo build -v -p groundhog_xdr --features=xdrs
      - name: cargo build syscalls
        run: CARGO_NET_GIT_FETCH_WITH_CLI=true cargo build -v -p groundhog_xdr --features=xdrs,syscalls
      - name: cargo build syscalls mock
        run: CARGO_NET_GIT_FETCH_WITH_CLI=true cargo build -v -p groundhog_xdr --features=xdrs,syscalls_mock
      - name: cargo build serde
        run: CARGO_NET_GIT_FETCH_WITH_CLI=true cargo build -v -p groundhog_xdr --features=serde
      - name: cargo build serde xdrs
        run: CARGO_NET_GIT_FETCH_WITH_CLI=true cargo build -v -p groundhog_xdr --features=serde,xdrs
      - name: cargo build serde alloc
        run: CARGO_NET_GIT_FETCH_WITH_CLI=true cargo build -v -p groundhog_xdr --features=serde,alloc
      - name: cargo build wasm
        run: CARGO_NET_GIT_FETCH_WITH_CLI=true cargo build -v -p groundhog_xdr --target=wasm32-unknown-unknown
      - name: cargo build wasm xdrs
        run: CARGO_NET_GIT_FETCH_WITH_CLI=true cargo build -v -p groundhog_xdr --target=wasm32-unknown-unknown --features=xdrs
      - name: cargo build wasm alloc
        run: CARGO_NET_GIT_FETCH_WITH_CLI=true cargo build -v -p groundhog_xdr --target=wasm32-unknown-unknown --features=alloc
      - name: run tests
        run: CARGO_NET_GIT_FETCH_WITH_CLI=true cargo test --features=std
      - name: build rpc
        run: CARGO_NET_GIT_FETCH_WITH_CLI=true cargo build -v -p groundhog_rpc
      - name: build scp
        run: CARGO_NET_GIT_FETCH_WITH_CLI=true cargo build -v -p groundhog_scp
      - name: format checks
        run: CARGO_NET_GIT_FETCH_WITH_CLI=true cargo fmt --check
