# .github/workflows/build.yml
name: Build

on:
  push:
    branches: [ "main" ]  
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: self-hosted

    # This cloning setup is different from the one in hogd,
    # either because there's an obscure webfactory bug (my previous hypothesis)
    # or, more likely, I mistyped a repo name when creating the deploy keys.
    steps:
      - name: Clean up .gitconfig
        run: |
          echo "Cleaning up .gitconfig"
          rm -f /home/hogci/.gitconfig
      - uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: |
            ${{ secrets.PROTOCOL_RS_GH_ACTIONS_PROTOCOL_ACCESS_KEY }}
            ${{ secrets.PROTOCOL_RS_GH_ACTIONS_SERDE_ARRAYS_KEY }}
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: cargo build default
        run: CARGO_NET_GIT_FETCH_WITH_CLI=true cargo +nightly build --verbose --manifest-path=groundhog_xdr/Cargo.toml
      - name: cargo build alloc
        run: CARGO_NET_GIT_FETCH_WITH_CLI=true cargo +nightly build --verbose --features=alloc --manifest-path=groundhog_xdr/Cargo.toml
      - name: cargo build std
        run: CARGO_NET_GIT_FETCH_WITH_CLI=true cargo +nightly build --verbose --features=std --manifest-path=groundhog_xdr/Cargo.toml
      - name: run tests
        run: CARGO_NET_GIT_FETCH_WITH_CLI=true cargo +nightly test --features=std --manifest-path=groundhog_xdr/Cargo.toml
      - name: format checks
        run: CARGO_NET_GIT_FETCH_WITH_CLI=true cargo +nightly fmt --check --manifest-path=groundhog_xdr/Cargo.toml
    
