# .github/workflows/build.yml
name: Build

on:
  workflow_dispatch:
  push:
    branches: [ "main", "auto-update/protocol" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: "0 7 * * 1"

permissions:
  contents: read

jobs:
  dependency-policy:
    permissions:
      contents: read
    uses: groundhogchain/actions/.github/workflows/rust-dependency-policy.yml@v1
    with:
      registry-name: groundhog
    secrets:
      registry-token: ${{ secrets.GROUNDHOG_REGISTRY_TOKEN }}

  workflow-lint:
    permissions:
      contents: read
    uses: groundhogchain/actions/.github/workflows/workflow-lint.yml@v1
    with:
      shellcheck-scripts: true

  build:
    needs: dependency-policy # inspect dependencies before anything builds them
    permissions:
      contents: read
    runs-on: self-hosted
    env:
      CARGO_REGISTRIES_GROUNDHOG_TOKEN: ${{ secrets.GROUNDHOG_REGISTRY_TOKEN }}
      CARGO_REGISTRY_GLOBAL_CREDENTIAL_PROVIDERS: cargo:token
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      
    steps:
      - name: Clean up .gitconfig
        run: |
          echo "Cleaning up .gitconfig"
          rm -f /home/hogci/.gitconfig
      - uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: |
            ${{ secrets.PROTOCOL_RS_GH_ACTIONS_PROTOCOL_ACCESS_KEY }}
            ${{ secrets.PROTOCOL_RS_SELF_ACCESS_KEY }}
            ${{ secrets.PROTOCOL_RS_TO_XDRS_ACCESS_KEY }}
            ${{ secrets.PROTOCOL_RS_TO_XDR_COMMON }}
            ${{ secrets.PROTOCOL_RS_TO_XDR_RPC }}
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          submodules: recursive
          persist-credentials: false
      - name: Install rustup if needed
        run: |
          if ! command -v rustup >/dev/null 2>&1; then
            CARGO_HOME="${CARGO_HOME:-$HOME/.cargo}"
            curl --proto '=https' --tlsv1.2 --retry 10 --retry-connrefused \
              --location --silent --show-error --fail https://sh.rustup.rs \
              | sh -s -- --default-toolchain none --profile minimal -y
            echo "CARGO_HOME=$CARGO_HOME" >> "$GITHUB_ENV"
            echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"
          fi
      - name: Set up Rust 1.96
        run: |
          rustup toolchain install 1.96.0 --profile minimal --component clippy,rustfmt --target riscv32im-unknown-none-elf --no-self-update
          rustup default 1.96.0
      - name: Set up dated nightly for rustdoc and rustfmt
        run: |
          rustup toolchain install nightly-2026-05-26 --profile minimal --component rustfmt --no-self-update
          rustup default nightly-2026-05-26
      - name: Generate hogd read token
        id: hogd-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1.12.0
        with:
          app-id: ${{ vars.PROTOCOL_SYNCHRONIZER_APP_ID }}
          private-key: ${{ secrets.PROTOCOL_SYNCHRONIZER_SECRET_KEY }}
          owner: groundhogchain
          repositories: hogd
          permission-contents: read
      - name: Download x23c
        run: |
          gh release download latest-x23c \
            --repo groundhogchain/hogd \
            --pattern 'x23c-linux-x86_64.tar.gz' \
            --dir "$RUNNER_TEMP"
          tar xzf "$RUNNER_TEMP/x23c-linux-x86_64.tar.gz" -C "$RUNNER_TEMP"
          chmod +x "$RUNNER_TEMP/x23c"
        env:
          GH_TOKEN: ${{ steps.hogd-token.outputs.token }}
      - name: Install generation dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/protocol-rs-generator"
          "$RUNNER_TEMP/protocol-rs-generator/bin/pip" install 'PyYAML==6.0.3'
          echo "$RUNNER_TEMP/protocol-rs-generator/bin" >> "$GITHUB_PATH"
      - name: Setup environment
        uses: ./.github/actions/setup
      - name: Generate missing executor bindings for review
        run: |
          "$RUNNER_TEMP/x23c" --rust --rust-feature xdrs --rust-feature schema --rust-no-feature spec -o "$RUNNER_TEMP/sched_exec.rs" protocol/sched_exec.x
          "$RUNNER_TEMP/x23c" --rust --rust-feature xdrs --rust-feature std --rust-no-feature schema --rust-no-feature spec --rust-no-feature serde -o "$RUNNER_TEMP/sched_exec_standalone.rs" protocol/sched_exec.x
          python3 -c 'import json,os,pathlib; p=pathlib.Path(os.environ["RUNNER_TEMP"]); print("GENERATED_SCHED_EXEC="+json.dumps({n:(p/n).read_text() for n in ["sched_exec.rs","sched_exec_standalone.rs"]}))'
      - name: Run CI checks
        run: XDRC="$RUNNER_TEMP/x23c" ./scripts/ci-check.sh

  stable-compat:
    name: Current stable compatibility
    needs: dependency-policy
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
    runs-on: self-hosted
    steps:
      - name: Clean up .gitconfig
        run: rm -f /home/hogci/.gitconfig
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Install rustup if needed
        run: |
          if ! command -v rustup >/dev/null 2>&1; then
            CARGO_HOME="${CARGO_HOME:-$HOME/.cargo}"
            curl --proto '=https' --tlsv1.2 --retry 10 --retry-connrefused \
              --location --silent --show-error --fail https://sh.rustup.rs \
              | sh -s -- --default-toolchain none --profile minimal -y
            echo "CARGO_HOME=$CARGO_HOME" >> "$GITHUB_ENV"
            echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"
          fi
      - name: Set up current stable Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
      - name: Test workspace
        env:
          CARGO_REGISTRIES_GROUNDHOG_TOKEN: ${{ secrets.GROUNDHOG_REGISTRY_TOKEN }}
          CARGO_REGISTRY_GLOBAL_CREDENTIAL_PROVIDERS: cargo:token
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"
        run: cargo +stable test --workspace --locked
