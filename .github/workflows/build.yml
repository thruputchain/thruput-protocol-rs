# .github/workflows/build.yml
name: Build

on:
  push:
    branches: [ "main" ]  
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-24.04

    # As far as I can tell (mostly with chatgpt help)
    # the way that hogd does this (ssh-agent, then checkout)
    # fails because webfactory does the ssh key targeting by
    # some github insteadOf string replacements, which allow prefix matches
    # and thus protocol-rs gets the key targeted to protocol.
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: none
      - uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: |
            ${{ secrets.PROTOCOL_RS_GH_ACTIONS_PROTOCOL_ACCESS_KEY }}
            ${{ secrets.PROTOCOL_RS_GH_ACTIONS_SERDE_ARRAYS_KEY }}
      - name: update submodules
        run: git submodule update --init protocol && git submodule update --init external/serde_arrays

      - name: cargo build default
        run: cargo build --verbose --manifest-path=groundhog_xdr/Cargo.toml
      - name: cargo build alloc
        run: cargo build --verbose --features=alloc --manifest-path=groundhog_xdr/Cargo.toml
      - name: cargo build std
        run: cargo build --verbose --features=std --manifest-path=groundhog_xdr/Cargo.toml
      - name: run tests
        run: cargo test --features=std --manifest-path=groundhog_xdr/Cargo.toml
      - name: prep rustfmt
        run: rustup component add --toolchain nightly-x86_64-unknown-linux-gnu rustfmt
      - name: format checks
        run: cargo +nightly fmt --check --manifest-path=groundhog_xdr/Cargo.toml
    
