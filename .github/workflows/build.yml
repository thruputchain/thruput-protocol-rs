# .github/workflows/build.yml
name: Build

on:
  workflow_dispatch:
  push:
    branches: [ "main", "auto-update/protocol" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: "0 7 * * 1"

permissions:
  contents: read

jobs:
  dependency-policy:
    permissions:
      contents: read
    uses: thruputchain/actions/.github/workflows/rust-dependency-policy.yml@484be875e4e630d26594110bcc0ab6bf42eeaba7

  workflow-lint:
    permissions:
      contents: read
    uses: thruputchain/actions/.github/workflows/workflow-lint.yml@484be875e4e630d26594110bcc0ab6bf42eeaba7
    with:
      lint-app-id: ${{ vars.PROTOCOL_SYNCHRONIZER_APP_ID }}
      shellcheck-scripts: true
    secrets:
      lint-app-private-key: ${{ secrets.PROTOCOL_SYNCHRONIZER_SECRET_KEY }}

  build:
    needs: dependency-policy # inspect dependencies before anything builds them
    permissions:
      contents: read
    runs-on: namespace-profile-hogd-linux-2604
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      
    steps:
      - name: Clean up .gitconfig
        run: |
          echo "Cleaning up .gitconfig"
          rm -f /home/hogci/.gitconfig
      - name: Generate protocol read token
        id: protocol-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.PROTOCOL_SYNCHRONIZER_APP_ID }}
          private-key: ${{ secrets.PROTOCOL_SYNCHRONIZER_SECRET_KEY }}
          owner: thruputchain
          repositories: thruput-protocol
          permission-contents: read
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Checkout protocol submodule
        env:
          GH_TOKEN: ${{ steps.protocol-token.outputs.token }}
        # `-c` scopes the token to this command; it is not written to git config.
        run: |
          git -c url."https://x-access-token:${GH_TOKEN}@github.com/thruputchain/thruput-protocol.git".insteadOf=git@github.com:thruputchain/thruput-protocol.git \
            submodule update --init --depth 1 protocol
      - name: Install rustup if needed
        run: |
          if ! command -v rustup >/dev/null 2>&1; then
            CARGO_HOME="${CARGO_HOME:-$HOME/.cargo}"
            curl --proto '=https' --tlsv1.2 --retry 10 --retry-connrefused \
              --location --silent --show-error --fail https://sh.rustup.rs \
              | sh -s -- --default-toolchain none --profile minimal -y
            echo "CARGO_HOME=$CARGO_HOME" >> "$GITHUB_ENV"
            echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"
          fi
      - name: Set up Rust 1.96
        run: |
          rustup toolchain install 1.96.0 --profile minimal --component clippy,rustfmt --target riscv32im-unknown-none-elf --no-self-update
          rustup default 1.96.0
      - name: Set up dated nightly for rustdoc and rustfmt
        run: |
          rustup toolchain install nightly-2026-05-26 --profile minimal --component rustfmt --no-self-update
          rustup default nightly-2026-05-26
      - name: Generate hogd read token
        id: hogd-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.PROTOCOL_SYNCHRONIZER_APP_ID }}
          private-key: ${{ secrets.PROTOCOL_SYNCHRONIZER_SECRET_KEY }}
          owner: thruputchain
          repositories: hogd
          permission-contents: read
      - name: Download x23c
        run: |
          gh release download latest-x23c \
            --repo thruputchain/hogd \
            --pattern 'x23c-linux-x86_64.tar.gz' \
            --dir "$RUNNER_TEMP"
          tar xzf "$RUNNER_TEMP/x23c-linux-x86_64.tar.gz" -C "$RUNNER_TEMP"
          chmod +x "$RUNNER_TEMP/x23c"
        env:
          GH_TOKEN: ${{ steps.hogd-token.outputs.token }}
      - name: Install generation dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/protocol-rs-generator"
          "$RUNNER_TEMP/protocol-rs-generator/bin/pip" install 'PyYAML==6.0.3'
          echo "$RUNNER_TEMP/protocol-rs-generator/bin" >> "$GITHUB_PATH"
      - name: Setup environment
        uses: ./.github/actions/setup
      - name: Run CI checks
        run: XDRC="$RUNNER_TEMP/x23c" ./scripts/ci-check.sh

  stable-compat:
    name: Current stable compatibility
    needs: dependency-policy
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
    runs-on: namespace-profile-hogd-linux-2604
    steps:
      - name: Clean up .gitconfig
        run: rm -f /home/hogci/.gitconfig
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install rustup if needed
        run: |
          if ! command -v rustup >/dev/null 2>&1; then
            CARGO_HOME="${CARGO_HOME:-$HOME/.cargo}"
            curl --proto '=https' --tlsv1.2 --retry 10 --retry-connrefused \
              --location --silent --show-error --fail https://sh.rustup.rs \
              | sh -s -- --default-toolchain none --profile minimal -y
            echo "CARGO_HOME=$CARGO_HOME" >> "$GITHUB_ENV"
            echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"
          fi
      - name: Set up current stable Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
      - name: Test workspace
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"
        run: cargo +stable test --workspace --locked
