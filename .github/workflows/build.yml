# .github/workflows/build.yml
name: Build

on:
  workflow_dispatch:
  push:
    branches: [ "main", "auto-update/protocol" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: "0 7 * * 1"

permissions:
  contents: read

jobs:
  dependency-policy:
    # (No registry credentials here: every dependency comes from crates.io.)
    permissions:
      contents: read
    uses: thruputchain/actions/.github/workflows/rust-dependency-policy.yml@3e0d08d054591a349331ab57fe72197d6ccc0cf3

  workflow-lint:
    permissions:
      contents: read
    uses: thruputchain/actions/.github/workflows/workflow-lint.yml@3e0d08d054591a349331ab57fe72197d6ccc0cf3
    with:
      shellcheck-scripts: true

  # Builds and tests the committed sources. It needs no secrets and neither
  # private repository (the protocol submodule, x23c), so it runs the same
  # for pull requests from forks.
  build:
    needs: dependency-policy # inspect dependencies before anything builds them
    permissions:
      contents: read
    runs-on: ubuntu-latest
    # ci-check.sh takes a few minutes; a hung test should fail the job, not
    # hold the runner for the 6-hour default.
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Rust 1.96
        run: rustup toolchain install 1.96.0 --profile minimal --component clippy,rustfmt --target riscv32im-unknown-none-elf --no-self-update
      - name: Run CI checks
        run: ./scripts/ci-check.sh

  # Checks that the committed generated sources match the protocol submodule
  # and the latest x23c. Both live in private repositories, read with the
  # protocol synchronizer App's tokens, so this job runs only where the
  # repository's secrets are: not for pull requests from forks (their
  # generated sources are checked when they reach main). It runs on the
  # runner the x23c release binary is built for.
  generated:
    name: Generated sources
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
    runs-on: namespace-profile-hogd-linux-2604
    steps:
      - name: Generate protocol read token
        id: protocol-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.PROTOCOL_SYNCHRONIZER_APP_ID }}
          private-key: ${{ secrets.PROTOCOL_SYNCHRONIZER_SECRET_KEY }}
          owner: thruputchain
          repositories: thruput-protocol
          permission-contents: read
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Checkout protocol submodule
        env:
          GH_TOKEN: ${{ steps.protocol-token.outputs.token }}
        # `-c` scopes the token to this command; it is not written to git config.
        run: |
          git -c url."https://x-access-token:${GH_TOKEN}@github.com/thruputchain/thruput-protocol.git".insteadOf=git@github.com:thruputchain/thruput-protocol.git \
            submodule update --init --depth 1 protocol
      - name: Generate hogd read token
        id: hogd-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.PROTOCOL_SYNCHRONIZER_APP_ID }}
          private-key: ${{ secrets.PROTOCOL_SYNCHRONIZER_SECRET_KEY }}
          owner: thruputchain
          repositories: hogd
          permission-contents: read
      - name: Download x23c
        run: |
          gh release download latest-x23c \
            --repo thruputchain/hogd \
            --pattern 'x23c-linux-x86_64.tar.gz' \
            --dir "$RUNNER_TEMP"
          tar xzf "$RUNNER_TEMP/x23c-linux-x86_64.tar.gz" -C "$RUNNER_TEMP"
          chmod +x "$RUNNER_TEMP/x23c"
        env:
          GH_TOKEN: ${{ steps.hogd-token.outputs.token }}
      - name: Install generation dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/protocol-rs-generator"
          "$RUNNER_TEMP/protocol-rs-generator/bin/pip" install 'PyYAML==6.0.3'
          echo "$RUNNER_TEMP/protocol-rs-generator/bin" >> "$GITHUB_PATH"
      - name: Check generated sources
        run: XDRC="$RUNNER_TEMP/x23c" ./scripts/generate.sh --check

  stable-compat:
    name: Current stable compatibility
    needs: dependency-policy
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up current stable Rust
        run: rustup toolchain install stable --profile minimal --no-self-update
      - name: Test workspace
        run: cargo +stable test --workspace --locked
