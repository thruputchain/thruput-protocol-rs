# .github/workflows/build.yml
name: Build

on:
  push:
    branches: [ "main", "auto-update/protocol" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: self-hosted
    env:
      CARGO_REGISTRIES_GROUNDHOG_TOKEN: ${{ secrets.GROUNDHOG_REGISTRY_TOKEN }}
      CARGO_REGISTRY_GLOBAL_CREDENTIAL_PROVIDERS: cargo:token
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      
    steps:
      - name: Clean up .gitconfig
        run: |
          echo "Cleaning up .gitconfig"
          rm -f /home/hogci/.gitconfig
      - uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: |
            ${{ secrets.PROTOCOL_RS_GH_ACTIONS_PROTOCOL_ACCESS_KEY }}
            ${{ secrets.PROTOCOL_RS_GH_ACTIONS_SERDE_ARRAYS_KEY }}
            ${{ secrets.PROTOCOL_RS_SELF_ACCESS_KEY }}
            ${{ secrets.PROTOCOL_RS_TO_XDRS_ACCESS_KEY }}
            ${{ secrets.PROTOCOL_RS_TO_XDR_COMMON }}
            ${{ secrets.PROTOCOL_RS_TO_XDR_RPC }}
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Setup environment
        uses: ./.github/actions/setup
      - name: cargo build default
        run: cargo build -p groundhog-xdr
      - name: cargo build alloc
        run: cargo build -p groundhog-xdr --features=alloc
      - name: cargo build std
        run: cargo build -p groundhog-xdr --features=std
      - name: cargo build xdrs
        run: cargo build -p groundhog-xdr --features=xdrs
      - name: cargo build syscalls mock
        run: cargo build -p groundhog-xdr --features=xdrs,syscalls_mock
      - name: cargo doc
        run: CARGO_NET_GIT_FETCH_WITH_CLI=true RUSTDOCFLAGS="--cfg docsrs" cargo +nightly doc -F syscalls --no-deps -p groundhog-xdr
      - name: cargo build serde
        run: cargo build -p groundhog-xdr --features=serde
      - name: cargo build serde xdrs
        run: cargo build -p groundhog-xdr --features=serde,xdrs
      - name: cargo build serde alloc
        run: cargo build -p groundhog-xdr --features=serde,alloc
      - name: cargo build wasm
        run: |
          rustup target add wasm32-unknown-unknown
          cargo build -p groundhog-xdr --target=wasm32-unknown-unknown
      - name: cargo build syscalls
        run: cargo build -p groundhog-xdr --features=xdrs,syscalls --target=wasm32-unknown-unknown
      - name: cargo build wasm xdrs
        run: cargo build -p groundhog-xdr --target=wasm32-unknown-unknown --features=xdrs
      - name: cargo build wasm alloc
        run: cargo build -p groundhog-xdr --target=wasm32-unknown-unknown --features=alloc
      - name: run tests
        run: cargo test --features=std
      - name: build rpc
        run: cargo build -p groundhog_rpc
      - name: build scp
        run: cargo build -p groundhog_scp
      - name: build trace
        run: cargo build -p groundhog-trace
      - name: format checks
        run: cargo fmt --check
      - name: build spec
        run: cargo build -p groundhog-spec
      - name: clippy macros
        run: cargo clippy -p groundhog-xdr-macros -- -D warnings
