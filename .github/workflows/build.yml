# .github/workflows/build.yml
name: Build

on:
  workflow_dispatch:
  push:
    branches: [ "main", "auto-update/protocol" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: "0 7 * * 1"

jobs:
  build:
    runs-on: self-hosted
    env:
      CARGO_REGISTRIES_GROUNDHOG_TOKEN: ${{ secrets.GROUNDHOG_REGISTRY_TOKEN }}
      CARGO_REGISTRY_GLOBAL_CREDENTIAL_PROVIDERS: cargo:token
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      
    steps:
      - name: Clean up .gitconfig
        run: |
          echo "Cleaning up .gitconfig"
          rm -f /home/hogci/.gitconfig
      - uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: |
            ${{ secrets.PROTOCOL_RS_GH_ACTIONS_PROTOCOL_ACCESS_KEY }}
            ${{ secrets.PROTOCOL_RS_GH_ACTIONS_SERDE_ARRAYS_KEY }}
            ${{ secrets.PROTOCOL_RS_SELF_ACCESS_KEY }}
            ${{ secrets.PROTOCOL_RS_TO_XDRS_ACCESS_KEY }}
            ${{ secrets.PROTOCOL_RS_TO_XDR_COMMON }}
            ${{ secrets.PROTOCOL_RS_TO_XDR_RPC }}
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Set up Rust 1.96
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.96.0
          components: clippy, rustfmt
          targets: riscv32im-unknown-none-elf, wasm32-unknown-unknown
      - name: Set up dated nightly for rustdoc and rustfmt
        uses: dtolnay/rust-toolchain@4fd1da8b0805d2d2e936788875a7d65dbd677dc2 # nightly
        with:
          toolchain: nightly-2026-05-26
          components: rustfmt
      - name: Generate hogd read token
        id: hogd-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.PROTOCOL_SYNCHRONIZER_APP_ID }}
          private-key: ${{ secrets.PROTOCOL_SYNCHRONIZER_SECRET_KEY }}
          owner: groundhogchain
          repositories: hogd
      - name: Download x23c
        run: |
          gh release download latest-x23c \
            --repo groundhogchain/hogd \
            --pattern 'x23c-linux-x86_64.tar.gz' \
            --dir "$RUNNER_TEMP"
          tar xzf "$RUNNER_TEMP/x23c-linux-x86_64.tar.gz" -C "$RUNNER_TEMP"
          chmod +x "$RUNNER_TEMP/x23c"
        env:
          GH_TOKEN: ${{ steps.hogd-token.outputs.token }}
      - name: Install generation dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/protocol-rs-generator"
          "$RUNNER_TEMP/protocol-rs-generator/bin/pip" install 'PyYAML==6.0.3'
          echo "$RUNNER_TEMP/protocol-rs-generator/bin" >> "$GITHUB_PATH"
      - name: Check generated sources
        run: XDRC="$RUNNER_TEMP/x23c" ./scripts/generate.sh --check
      - name: Setup environment
        uses: ./.github/actions/setup
      - name: cargo build default
        run: cargo build --locked -p groundhog-xdr
      - name: cargo build alloc
        run: cargo build --locked -p groundhog-xdr --features=alloc
      - name: cargo build std
        run: cargo build --locked -p groundhog-xdr --features=std
      - name: cargo build xdrs
        run: cargo build --locked -p groundhog-xdr --features=xdrs
      - name: cargo build syscalls mock
        run: cargo build --locked -p groundhog-xdr --features=xdrs,syscalls_mock
      - name: cargo doc
        run: CARGO_NET_GIT_FETCH_WITH_CLI=true cargo +nightly-2026-05-26 doc --locked -F syscalls_mock --no-deps -p groundhog-xdr
      - name: cargo build serde
        run: cargo build --locked -p groundhog-xdr --features=serde
      - name: cargo build serde xdrs
        run: cargo build --locked -p groundhog-xdr --features=serde,xdrs
      - name: cargo build serde alloc
        run: cargo build --locked -p groundhog-xdr --features=serde,alloc
      - name: cargo build wasm
        run: cargo build --locked -p groundhog-xdr --target=wasm32-unknown-unknown
      - name: cargo build syscalls
        run: cargo build --locked -p groundhog-xdr --features=xdrs,syscalls --target=wasm32-unknown-unknown
      - name: cargo build riscv32 syscalls
        run: cargo build --locked -p groundhog-xdr --features=xdrs,syscalls --target=riscv32im-unknown-none-elf
      - name: cargo build wasm xdrs
        run: cargo build --locked -p groundhog-xdr --target=wasm32-unknown-unknown --features=xdrs
      - name: cargo build wasm alloc
        run: cargo build --locked -p groundhog-xdr --target=wasm32-unknown-unknown --features=alloc
      - name: run tests
        run: cargo test --locked --features=std
      - name: build rpc
        run: cargo build --locked -p groundhog_rpc
      - name: build scp
        run: cargo build --locked -p groundhog_scp
      - name: build trace
        run: cargo build --locked -p groundhog-trace
      - name: format checks
        run: cargo +nightly-2026-05-26 fmt --check
      - name: build spec
        run: cargo build --locked -p groundhog-spec
      - name: clippy macros
        run: cargo clippy --locked -p groundhog-xdr-macros -- -D warnings

  stable-compat:
    name: Current stable compatibility
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: self-hosted
    steps:
      - name: Clean up .gitconfig
        run: rm -f /home/hogci/.gitconfig
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up current stable Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - name: Test workspace
        env:
          CARGO_REGISTRIES_GROUNDHOG_TOKEN: ${{ secrets.GROUNDHOG_REGISTRY_TOKEN }}
          CARGO_REGISTRY_GLOBAL_CREDENTIAL_PROVIDERS: cargo:token
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"
        run: cargo +stable test --workspace --locked
