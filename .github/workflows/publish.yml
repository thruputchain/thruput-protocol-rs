# Releases every published crate in this workspace to crates.io in one
# idempotent pass, with the shared thruputchain/actions release actions (the
# same flow as thruputchain/xdrs).
#
# Nothing is tagged until the semver check, the dry run and the release check
# pass, so a run that fails before tagging leaves the repository untouched.
# Publishing skips versions crates.io already has, so a run that fails partway
# is resumed by dispatching it again on the tagged commit.
#
# Authentication: crates.io trusted publishing (GitHub OIDC) for existing
# crates; see crates-io-publish's README in thruputchain/actions. Creating a
# crate needs the CRATESIO_CREATE_PACKAGE_TOKEN secret, a crates.io API token
# with the scopes publish-new, trusted-publishing and change-owners. The
# publish step registers this workflow as each new crate's trusted publisher
# and adds CRATE_OWNERS as its owners, so remove the secret and revoke the
# token once every crate exists.
name: Release package

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Run publish checks only; skip tagging and publishing'
        type: boolean
        default: false

# Two concurrent releases would race on tags and registry state; queue them.
concurrency:
  group: publish

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  # Owners added to each crate a run creates, besides the token's owner.
  CRATE_OWNERS: github:thruputchain:core-maintainers
  # Every publish = ["crates-io"] package, in dependency order: each after
  # the workspace crates it depends on.
  PACKAGES: >-
    hogexec-internal
    thruput-syscall
    thruput-xdr-macros
    thruput-xdr
    thruput-scp
    thruput-akkad
    thruput-coordinator
    thruput-trace
    thruput-scheduler
    thruput-db-gateway
    thruput-indexer
    thruput-spec
    thruput-view

permissions:
  contents: read

jobs:
  publish:
    permissions:
      contents: write # pushes the version tag
      id-token: write # crates.io trusted publishing
    runs-on: namespace-profile-hogd-linux-2604

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history and tags: the semver baseline below is a git checkout
          # of the previous release tag.
          fetch-depth: 0

      - name: Install rustup if needed
        run: |
          if ! command -v rustup >/dev/null 2>&1; then
            CARGO_HOME="${CARGO_HOME:-$HOME/.cargo}"
            curl --proto '=https' --tlsv1.2 --retry 10 --retry-connrefused \
              --location --silent --show-error --fail https://sh.rustup.rs \
              | sh -s -- --default-toolchain none --profile minimal -y
            echo "CARGO_HOME=$CARGO_HOME" >> "$GITHUB_ENV"
            echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"
          fi
      - name: Set up Rust 1.96
        run: |
          rustup toolchain install 1.96.0 --profile minimal --component clippy,rustfmt --target riscv32im-unknown-none-elf --no-self-update
          rustup default 1.96.0
      - name: Set up dated nightly for rustdoc and rustfmt
        run: |
          rustup toolchain install nightly-2026-05-26 --profile minimal --component rustfmt --no-self-update
          rustup default nightly-2026-05-26
      - name: Install cargo-hack
        env:
          CARGO_HACK_VERSION: '0.6.45'
        run: |
          source "$HOME/.cargo/env"
          if [ "$(cargo hack --version 2>/dev/null | awk '{print $2}')" != "$CARGO_HACK_VERSION" ]; then
            cargo install cargo-hack --version "=$CARGO_HACK_VERSION" --locked
          fi
          cargo hack --version

      # Must run before the dry-run step: cargo-publish-dry-run extracts every
      # workspace crate into ./vendor/, and cargo-semver-checks then sees each
      # package defined by two manifests ("package is ambiguous") and errors out
      # before running any semver checks.
      # Must also run before the tag step: once vX.Y.Z exists at HEAD, the
      # baseline would resolve to that new tag and compare the release against
      # itself. Here the workspace version is already bumped, so this validates
      # that the bump is large enough for the API changes since the previous
      # release.
      - name: Select semver baseline packages
        id: baseline
        run: |
          set -euo pipefail
          baseline=$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*')
          echo "revision=$baseline" >> "$GITHUB_OUTPUT"
          if git show "$baseline:Cargo.toml" | grep -q '^thruput-xdr ='; then
            echo "packages=" >> "$GITHUB_OUTPUT"
          else
            # New package identities have no same-name baseline. Keep checking
            # the unchanged package until a Thruput release becomes the baseline.
            echo "packages=hogexec-internal" >> "$GITHUB_OUTPUT"
          fi

      # Baselines released before the move to crates.io name the private
      # registry, which this repository no longer configures, so this step
      # alone defines it and holds its credential. Once a crates.io release
      # is the baseline, drop the env and the registry inputs.
      - name: semver check
        uses: thruputchain/actions/cargo-semver-checks@484be875e4e630d26594110bcc0ab6bf42eeaba7
        env:
          CARGO_REGISTRIES_THRUPUT_INDEX: sparse+https://crates.thruput.network/api/v1/crates/
          # Historical baselines may use this alias. Cargo unifies aliases
          # for the same index, so both names need the same credential.
          CARGO_REGISTRIES_GROUNDHOG_INDEX: sparse+https://crates.thruput.network/api/v1/crates/
          CARGO_REGISTRIES_GROUNDHOG_TOKEN: ${{ secrets.GROUNDHOG_REGISTRY_TOKEN }}
        with:
          baseline-rev: ${{ steps.baseline.outputs.revision }}
          packages: ${{ steps.baseline.outputs.packages }}
          semver-checks-version: '0.50.0'
          registry-name: thruput
          registry-token: ${{ secrets.GROUNDHOG_REGISTRY_TOKEN }}

      # The dry-run action never compiles publish=false crates (cargo-hack
      # runs with --ignore-private and clippy is skipped here), so the API
      # signature pins must be checked explicitly. See thruput-api-pins.
      - name: API signature pins
        run: |
          source "$HOME/.cargo/env"
          cargo check --package thruput-api-pins --locked

      # Verifies every crate offline, in dependency order: the action packages
      # each listed crate into vendor/ before the next one resolves against it.
      - name: dry run
        uses: thruputchain/actions/cargo-publish-dry-run@484be875e4e630d26594110bcc0ab6bf42eeaba7
        with:
          packages: ${{ env.PACKAGES }}
          registry-name: crates-io
          skip-clippy: true
          cargo-hack-feature-options: '--feature-powerset --group-features syscalls,syscalls_mock --ignore-unknown-features'

      # `v<version>` must be free or already on HEAD: a new commit needs a
      # version bump.
      - name: Check release
        id: check
        uses: thruputchain/actions/crates-io-publish@484be875e4e630d26594110bcc0ab6bf42eeaba7
        with:
          mode: check
          packages: ${{ env.PACKAGES }}
          bootstrap-token: ${{ secrets.CRATESIO_CREATE_PACKAGE_TOKEN }}

      - name: Tag release
        id: tag
        if: ${{ !inputs.dry-run && steps.check.outputs.release == 'true' }}
        uses: thruputchain/actions/cargo-release-tag@484be875e4e630d26594110bcc0ab6bf42eeaba7
        with:
          packages: ${{ env.PACKAGES }}
          github-token: ${{ github.token }}

      # Unlike the dry run, publishing resolves dependencies against
      # crates.io, hence the dependency order.
      - name: Publish
        if: ${{ !inputs.dry-run && steps.check.outputs.release == 'true' }}
        uses: thruputchain/actions/crates-io-publish@484be875e4e630d26594110bcc0ab6bf42eeaba7
        with:
          mode: publish
          packages: ${{ env.PACKAGES }}
          git-tag: ${{ steps.tag.outputs.tag }}
          bootstrap-token: ${{ secrets.CRATESIO_CREATE_PACKAGE_TOKEN }}
          crate-owners: ${{ env.CRATE_OWNERS }}
