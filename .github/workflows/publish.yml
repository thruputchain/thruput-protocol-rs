# Releases every published crate in this repository to crates.io in one
# idempotent pass, with the shared thruputchain/actions release actions. The
# crates share the workspace version and release under its `v<version>` tag.
#
# Nothing is tagged until the semver check, the API pins, the dry run and the
# release check pass, so a run that fails before tagging leaves the
# repository untouched. Publishing skips versions crates.io already has, so a
# run that fails partway is resumed by dispatching it again on the tagged
# commit.
#
# Authentication: crates.io trusted publishing (GitHub OIDC) for existing
# crates; see crates-io-publish's README in thruputchain/actions. Creating a
# crate needs the CRATESIO_CREATE_PACKAGE_TOKEN secret, a crates.io API token
# with the scopes publish-new, trusted-publishing and change-owners. The
# publish step registers this workflow as each new crate's trusted publisher
# and adds CRATE_OWNERS as its owners, so remove the secret and revoke the
# token once every crate exists.
#
# The job runs in the `release` environment, and the trusted publishers the
# publish step registers require it, so only runs that environment's
# protection rules admit (required reviewers, deployment branches limited to
# main) can publish. Keep CRATESIO_CREATE_PACKAGE_TOKEN a secret of
# `release`, not of the repository: repository secrets reach every branch.
#
# crates.io lets a token create five crates in a burst, then one every ten
# minutes, and the publish step waits those limits out: a release that
# creates every crate here takes well over an hour.
#
# Dispatch with dry-run for the checks, with no tagging or publishing.
name: Release package

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Run publish checks only; skip tagging and publishing'
        type: boolean
        default: false

# Two concurrent releases would race on tags and crates.io state; queue them.
concurrency:
  group: publish

env:
  # Owners added to each crate a run creates, besides the token's owner.
  CRATE_OWNERS: github:thruputchain:core-maintainers
  # Every published crate, in dependency order: the dry run packages each
  # crate into vendor/ before the next one resolves against it, and each
  # crate's dependencies must be live on crates.io before it publishes.
  PACKAGES: >-
    thruput-syscall
    thruput-xdr-macros
    thruput-xdr
    thruput-spec
    thruput-trace
    thruput-scp
    thruput-node-types
    thruput-node-rpc
    thruput-coordinator
    thruput-indexer
    thruput-db-gateway
    thruput-view

permissions:
  contents: read

jobs:
  publish:
    permissions:
      contents: write # pushes the release tag
      id-token: write # crates.io trusted publishing
    environment: release
    runs-on: namespace-profile-hogd-linux-2604

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history and tags: the semver baseline below is a git checkout
          # of the previous release tag, and the release check reads the tags.
          fetch-depth: 0

      - name: Install rustup if needed
        run: |
          if ! command -v rustup >/dev/null 2>&1; then
            CARGO_HOME="${CARGO_HOME:-$HOME/.cargo}"
            curl --proto '=https' --tlsv1.2 --retry 10 --retry-connrefused \
              --location --silent --show-error --fail https://sh.rustup.rs \
              | sh -s -- --default-toolchain none --profile minimal -y
            echo "CARGO_HOME=$CARGO_HOME" >> "$GITHUB_ENV"
            echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"
          fi
      - name: Set up Rust 1.96
        run: |
          rustup toolchain install 1.96.0 --profile minimal --component clippy,rustfmt --target riscv32im-unknown-none-elf --no-self-update
          rustup default 1.96.0
      - name: Install cargo-hack
        env:
          CARGO_HACK_VERSION: '0.6.45'
        run: |
          source "$HOME/.cargo/env"
          if [ "$(cargo hack --version 2>/dev/null | awk '{print $2}')" != "$CARGO_HACK_VERSION" ]; then
            cargo install cargo-hack --version "=$CARGO_HACK_VERSION" --locked
          fi
          cargo hack --version

      # A crate missing from PACKAGES would never be published, and a crate
      # that depends on it would then fail to publish halfway through.
      - name: Check PACKAGES lists every published crate
        run: |
          set -euo pipefail
          source "$HOME/.cargo/env"
          expected=$(cargo metadata --no-deps --format-version 1 --locked \
            | jq -r '.packages[] | select(.publish != []) | .name' | sort)
          listed=$(tr -s '[:space:]' '\n' <<<"$PACKAGES" | sed '/^$/d' | sort)
          if [ "$expected" != "$listed" ]; then
            echo "::error::PACKAGES in publish.yml doesn't match the workspace's published crates"
            diff <(echo "$expected") <(echo "$listed") || true
            exit 1
          fi

      # Must run before the dry-run step: cargo-publish-dry-run extracts every
      # workspace crate into ./vendor/, and cargo-semver-checks then sees each
      # package defined by two manifests ("package is ambiguous") and errors out
      # before running any semver checks.
      # Must also run before the tag step: once vX.Y.Z exists at HEAD, the
      # baseline would resolve to that new tag and compare the release against
      # itself. Here the workspace version is already bumped, so this validates
      # that the bump is large enough for the API changes since the previous
      # release, the nearest `v*` tag.
      - name: semver check
        uses: thruputchain/actions/cargo-semver-checks@3e0d08d054591a349331ab57fe72197d6ccc0cf3
        env:
          # Baselines released before the move to crates.io (v0.61.0 and
          # earlier) put `registry = "thruput"` on their path dependencies,
          # and cargo won't parse a manifest that names a registry it has no
          # index for. Path dependencies never contact a registry, so the
          # index only has to be defined, not reachable. Drop this once the
          # baseline is a crates.io release.
          CARGO_REGISTRIES_THRUPUT_INDEX: sparse+https://registry.invalid/
        with:
          semver-checks-version: '0.50.0'

      # The dry-run action never compiles publish=false crates (cargo-hack
      # runs with --ignore-private and clippy is skipped here), so the API
      # signature pins must be checked explicitly. See thruput-api-pins.
      - name: API signature pins
        run: |
          source "$HOME/.cargo/env"
          cargo check --package thruput-api-pins --locked

      - name: Publish dry run
        uses: thruputchain/actions/cargo-publish-dry-run@3e0d08d054591a349331ab57fe72197d6ccc0cf3
        with:
          packages: ${{ env.PACKAGES }}
          registry-name: crates-io
          skip-clippy: true
          cargo-hack-feature-options: '--feature-powerset --group-features syscalls,syscalls_mock --ignore-unknown-features'

      # `v<version>` must be free or already on HEAD: a new commit needs a
      # version bump.
      - name: Check release
        id: check
        uses: thruputchain/actions/crates-io-publish@3e0d08d054591a349331ab57fe72197d6ccc0cf3
        with:
          mode: check
          packages: ${{ env.PACKAGES }}
          bootstrap-token: ${{ secrets.CRATESIO_CREATE_PACKAGE_TOKEN }}

      - name: Tag release
        id: tag
        if: ${{ !inputs.dry-run && steps.check.outputs.release == 'true' }}
        uses: thruputchain/actions/cargo-release-tag@3e0d08d054591a349331ab57fe72197d6ccc0cf3
        with:
          packages: ${{ env.PACKAGES }}
          github-token: ${{ github.token }}

      - name: Publish
        if: ${{ !inputs.dry-run && steps.check.outputs.release == 'true' }}
        uses: thruputchain/actions/crates-io-publish@3e0d08d054591a349331ab57fe72197d6ccc0cf3
        with:
          mode: publish
          packages: ${{ env.PACKAGES }}
          git-tag: ${{ steps.tag.outputs.tag }}
          bootstrap-token: ${{ secrets.CRATESIO_CREATE_PACKAGE_TOKEN }}
          crate-owners: ${{ env.CRATE_OWNERS }}
