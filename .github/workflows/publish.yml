name: Release package

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Run publish checks only; skip tagging and publishing'
        type: boolean
        default: false

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  # Plain Cargo calls in the dry-run action need registry authentication too.
  CARGO_REGISTRIES_THRUPUT_TOKEN: ${{ secrets.GROUNDHOG_REGISTRY_TOKEN }}
  CARGO_REGISTRY_GLOBAL_CREDENTIAL_PROVIDERS: cargo:token

permissions:
  contents: read

jobs:
  publish:
    permissions:
      contents: write # pushes the version tag
    runs-on: hog1

    steps:
      - name: Clean up .gitconfig
        run: |
            echo "Cleaning up .gitconfig"
            rm -f /home/hogci/.gitconfig

      - name: Setup SSH Agent
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: |
            ${{ secrets.ACTIONS_KEY }}

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          # Full history and tags: the semver baseline below is a git checkout
          # of the previous release tag.
          fetch-depth: 0

      - name: Configure git to use SSH
        run: |
          git config --global url."git@github.com:".insteadOf "https://github.com/"

      - name: Checkout actions repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: groundhogchain/actions
          path: actions
          ref: 16e3402eca906d0771f171ee95fcba8a0be8b0aa # registry alias support
          persist-credentials: false

      # Must run before the dry-run step: cargo-publish-dry-run extracts every
      # workspace crate into ./vendor/, and cargo-semver-checks then sees each
      # package defined by two manifests ("package is ambiguous") and errors out
      # before running any semver checks.
      # Must also run before the tag step: once vX.Y.Z exists at HEAD, the
      # baseline would resolve to that new tag and compare the release against
      # itself. Here the workspace version is already bumped, so this validates
      # that the bump is large enough for the API changes since the previous
      # release.
      - name: Select semver baseline packages
        id: baseline
        run: |
          set -euo pipefail
          baseline=$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*')
          echo "revision=$baseline" >> "$GITHUB_OUTPUT"
          if git show "$baseline:Cargo.toml" | grep -q '^thruput-xdr ='; then
            echo "packages=" >> "$GITHUB_OUTPUT"
            echo "legacy-registry=false" >> "$GITHUB_OUTPUT"
          else
            # New package identities have no same-name baseline. Keep checking
            # the unchanged package until a Thruput release becomes the baseline.
            echo "packages=hogexec-internal" >> "$GITHUB_OUTPUT"
            echo "legacy-registry=true" >> "$GITHUB_OUTPUT"
          fi

      - name: semver check
        uses: ./actions/cargo-semver-checks
        env:
          # The previous release still resolves its dependencies via this alias.
          CARGO_REGISTRIES_GROUNDHOG_INDEX: sparse+https://crates.thruput.network/api/v1/crates/
          CARGO_REGISTRIES_GROUNDHOG_TOKEN: ${{ steps.baseline.outputs.legacy-registry == 'true' && secrets.GROUNDHOG_REGISTRY_TOKEN || '' }}
        with:
          baseline-rev: ${{ steps.baseline.outputs.revision }}
          packages: ${{ steps.baseline.outputs.packages }}
          semver-checks-version: '0.50.0'
          registry-name: thruput
          registry-token: ${{ secrets.GROUNDHOG_REGISTRY_TOKEN }}

      # The dry-run action never compiles publish=false crates (cargo-hack
      # runs with --ignore-private and clippy is skipped here), so the API
      # signature pins must be checked explicitly. See thruput-api-pins.
      - name: API signature pins
        run: |
          source "$HOME/.cargo/env"
          cargo check --package thruput-api-pins --locked

      - name: dry run
        uses: ./actions/cargo-publish-dry-run
        with:
          registry-name: thruput
          skip-clippy: true
          cargo-hack-feature-options: '--feature-powerset --group-features syscalls,syscalls_mock --ignore-unknown-features'

      - name: tag commit with version
        if: ${{ !inputs.dry-run }}
        id: publish-tag
        uses: ./actions/cargo-version-tag

      - name: push tag
        if: ${{ !inputs.dry-run }}
        env:
          ACTOR: ${{ github.actor }}
          TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ steps.publish-tag.outputs.tag }}
        run: |
          git remote set-url origin "https://$ACTOR:$TOKEN@github.com/$REPOSITORY.git"
          LOCAL_COMMIT=$(git rev-parse "$TAG")
          # Check if tag exists on remote and get its commit SHA
          REMOTE_TAG_REF=$(git ls-remote origin "refs/tags/$TAG" | cut -f1)
          if [ -n "$REMOTE_TAG_REF" ]; then
            # Tag exists on remote, verify it points to the same commit
            if [ "$REMOTE_TAG_REF" = "$LOCAL_COMMIT" ]; then
              echo "Tag $TAG already exists on remote and points to the same commit ($LOCAL_COMMIT). Skipping push."
            else
              echo "Error: Tag $TAG exists on remote but points to different commit!"
              echo "Remote: $REMOTE_TAG_REF"
              echo "Local: $LOCAL_COMMIT"
              exit 1
            fi
          else
            # Tag doesn't exist on remote, push it
            git push origin "$TAG"
          fi
          git remote set-url origin "git@github.com:$REPOSITORY.git"

      - name: publish
        if: ${{ !inputs.dry-run }}
        uses: ./actions/cargo-publish
        with:
          git-tag: ${{ steps.publish-tag.outputs.tag }}
          registry-name: thruput
          registry-token: ${{ secrets.GROUNDHOG_REGISTRY_TOKEN }}
          publish-delay-seconds: '10'
