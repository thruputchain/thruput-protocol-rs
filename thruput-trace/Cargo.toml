[package]
name = "thruput-trace"
version.workspace = true
rust-version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description =  "Thruput transaction traces"

# docs.rs builds the default features only; document the whole API.
[package.metadata.docs.rs]
all-features = true

[lib]
crate-type = ["rlib"]

[features]
default = []
std = []
serde = [
    "dep:serde",
    "xdrs/serde",
    "thruput-xdr/serde",
]

[dependencies.schemars]
workspace = true

[dependencies.serde]
optional = true
version = "1.0.219"
default-features = false
features = ["derive"]

[dependencies.thruput-xdr]
workspace = true
features = ["xdrs", "alloc", "schema"]

[dependencies.xdrs]
workspace = true
features = ["derive", "int128", "alloc", "schemars"]

[dependencies.thruput-exec-internal]
workspace = true

[dependencies.xdr-common]
workspace = true
