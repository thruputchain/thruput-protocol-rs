[package]
name = "groundhog_coordinator"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["rlib"]

[features]
default = ["alloc", "std", "xdrs"]
alloc = ["xdrs", "xdrs/alloc"]
std = ["alloc"]
xdrs = []
spec = [] # enable dump of XDR specs
serde = [
    "dep:serde",
    "dep:serde_arrays",
    "dep:serde_with",
    "xdrs/serde",
    "groundhog_scp/serde",
    "groundhog-xdr/serde",
]

[dependencies]
async-trait = "0.1.89"

[dependencies.serde]
optional = true
version = "1.0.219"
default-features = false
features = ["derive"]

[dependencies.serde_arrays]
optional = true
workspace = true
default-features = false

[dependencies.serde_with]
workspace = true
optional = true
features = []

[dependencies.groundhog_scp]
workspace = true
features = ["std", "xdrs"]

[dependencies.groundhog-xdr]
workspace = true
features = ["std", "xdrs"]

[dependencies.xdrs]
workspace = true
features = ["derive", "alloc"]

[dependencies.rpc_driver]
workspace = true
