[package]
name = "thruput-coordinator"
version.workspace = true
rust-version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description =  "Bindings for Thruput coordinator rpcs"

[lib]
crate-type = ["rlib"]

[features]
default = ["alloc", "std"]
alloc = ["xdrs/alloc"]
std = ["alloc"]
serde = [
    "dep:serde",
    "xdrs/serde",
    "thruput-scp/serde",
    "thruput-xdr/serde",
]

[dependencies]
async-trait = "0.1.89"

[dependencies.schemars]
workspace = true

[dependencies.serde]
optional = true
version = "1.0.219"
default-features = false
features = ["derive"]

[dependencies.thruput-scp]
workspace = true
features = ["std"]

[dependencies.thruput-xdr]
workspace = true
features = ["std", "xdrs", "schema"]

[dependencies.xdrs]
workspace = true
features = ["derive", "alloc", "schemars"]

[dependencies.thruput-rpc-api]
workspace = true
