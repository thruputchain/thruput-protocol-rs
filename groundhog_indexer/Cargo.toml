[package]
name = "groundhog_indexer"
description = "Bindings for groundhog indexer RPCs (IndexerBlockExplorer, IndexerEvent, EventIndexer)"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
crate-type = ["rlib"]

[features]
default = ["alloc", "std"]
alloc = ["xdrs/alloc", "groundhog-xdr/alloc"]
std = ["alloc"]
serde = [
    "dep:serde",
    "dep:serde_arrays",
    "dep:serde_with",
    "xdrs/serde",
    "groundhog-xdr/serde",
    "groundhog_scheduler/serde",
    "groundhog-trace/serde",
]

[dependencies]
async-trait = "0.1.89"
groundhog-xdr = { workspace = true, features = ["std", "xdrs", "schema"] }
groundhog_scheduler = { workspace = true, features = ["std"] }
groundhog-trace = { workspace = true, features = ["std"] }
groundhog_scp = { workspace = true, features = ["std"] }
xdrs = { workspace = true, features = ["derive", "alloc", "schemars"] }
xdr-common = { workspace = true }
rpc_driver = { workspace = true }

schemars = { workspace = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_with = { workspace = true, optional = true }
serde_arrays = { workspace = true, optional = true }

[dev-dependencies]
serde_json = "1"
