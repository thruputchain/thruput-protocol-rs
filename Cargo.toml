[workspace]
members = [
    "hogexec-internal",
    "groundhog-xdr-macros",
    "groundhog-syscall",
    "groundhog-xdr",
    "groundhog_rpc",
    "groundhog_scp",
    "groundhog_coordinator",
    "groundhog-akkad",
    "groundhog_hogx",
    "groundhog-trace",
    "groundhog_scheduler",
    "groundhog_indexer",
    "groundhog_db_gateway",
    "groundhog_view",
    "bin/rpcthroughput_server",
    "groundhog_xdr_syscall_tests",
    "groundhog-spec",
]
resolver = "2"

[workspace.package]
version = "0.21.0"
edition = "2024"
rust-version = "1.96"
authors = ["Groundhog Team"]
license = "Apache-2.0"
publish = ["groundhog"]
description = "Groundhog Protocol"
repository = "https://github.com/groundhogchain/protocol_rs.git"
homepage = "https://github.com/groundhogchain/protocol_rs.git"
keywords = ["groundhog"]
categories = ["blockchain"]

# These version numbers need to be kept in sync with the workspace package version number
[workspace.dependencies]
groundhog-syscall = { path = "groundhog-syscall", version = "=0.21.0", registry = "groundhog" }
groundhog-xdr = { path = "groundhog-xdr", version = "=0.21.0", registry = "groundhog" }
groundhog-xdr-macros = { path = "groundhog-xdr-macros", version = "=0.21.0", registry = "groundhog" }
groundhog-trace = { path = "groundhog-trace", version = "=0.21.0", registry = "groundhog" }
groundhog_scp = { path = "groundhog_scp", version = "=0.21.0", registry = "groundhog" }
groundhog_coordinator = { path = "groundhog_coordinator", version = "=0.21.0", registry = "groundhog" }
groundhog-akkad = { path = "groundhog-akkad", version = "=0.21.0", registry = "groundhog" }
groundhog_hogx = { path = "groundhog_hogx", version = "=0.21.0", registry = "groundhog" }
groundhog_rpc = { path = "groundhog_rpc", version = "=0.21.0", registry = "groundhog" }
groundhog_scheduler = { path = "groundhog_scheduler", version = "=0.21.0", registry = "groundhog" }
groundhog_indexer = { path = "groundhog_indexer", version = "=0.21.0", registry = "groundhog" }
groundhog_db_gateway = { path = "groundhog_db_gateway", version = "=0.21.0", registry = "groundhog" }
groundhog_view = { path = "groundhog_view", version = "=0.21.0", registry = "groundhog" }
hogexec-internal = { path = "hogexec-internal", version = "=0.21.0", registry = "groundhog" }
macros = { path = "macros", version = "=0.21.0", registry = "groundhog" }
groundhog-spec = { path = "groundhog-spec", version = "=0.21.0", registry = "groundhog" }
xdrs = { registry = "groundhog", version = "0.8", default-features = false, features = [
    "int128",
    "derive",
] }
xdr-common = { version = "0.8.4", registry = "groundhog" }
xdr-repr = { version = "0.8.4", registry = "groundhog" }
xdr-derive = { version = "0.8.4", registry = "groundhog" }
rpc_driver = { version = "0.10.1", registry = "groundhog" }
schemars = { version = "1" }
serde_arrays = { package = "groundhog-serde_arrays", version = "0.2.0", registry = "groundhog", default-features = false }

[profile.dev]
opt-level = 3
overflow-checks = false
debug = false
strip = "none"
panic = "abort"
lto = true
codegen-units = 1

[profile.test]
# settings inherited from profile.dev
opt-level = 0
overflow-checks = true
debug = true
strip = "none"
debug-assertions = true

[profile.release]
opt-level = 3
overflow-checks = false
debug = false
strip = "symbols"
debug-assertions = false
panic = "abort"
lto = true
codegen-units = 1
# also see rust flags set in .cargo/config.toml
