[workspace]
members = [
    "hogexec-internal",
    "thruput_xdr_macros",
    "thruput_syscall",
    "thruput_xdr",
    "thruput_rpc",
    "thruput_scp",
    "thruput_coordinator",
    "thruput_akkad",
    "thruput_hogx",
    "thruput_trace",
    "thruput_scheduler",
    "thruput_indexer",
    "thruput_db_gateway",
    "thruput_view",
    "thruput_api_pins",
    "bin/rpcthroughput_server",
    "thruput_xdr_syscall_tests",
    "thruput_spec",
]
resolver = "2"

[workspace.package]
version = "0.54.0"
edition = "2024"
rust-version = "1.96"
authors = ["Thruput Team"]
license = "Apache-2.0"
publish = ["thruput"]
description = "Thruput Protocol"
repository = "https://github.com/groundhogchain/protocol-rs.git"
homepage = "https://github.com/groundhogchain/protocol-rs.git"
keywords = ["thruput"]
categories = ["blockchain"]

# These version numbers need to be kept in sync with the workspace package version number
[workspace.dependencies]
thruput_syscall = { path = "thruput_syscall", version = "=0.54.0", registry = "thruput" }
thruput_xdr = { path = "thruput_xdr", version = "=0.54.0", registry = "thruput" }
thruput_xdr_macros = { path = "thruput_xdr_macros", version = "=0.54.0", registry = "thruput" }
thruput_trace = { path = "thruput_trace", version = "=0.54.0", registry = "thruput" }
thruput_scp = { path = "thruput_scp", version = "=0.54.0", registry = "thruput" }
thruput_coordinator = { path = "thruput_coordinator", version = "=0.54.0", registry = "thruput" }
thruput_akkad = { path = "thruput_akkad", version = "=0.54.0", registry = "thruput" }
thruput_hogx = { path = "thruput_hogx", version = "=0.54.0", registry = "thruput" }
thruput_rpc = { path = "thruput_rpc", version = "=0.54.0", registry = "thruput" }
thruput_scheduler = { path = "thruput_scheduler", version = "=0.54.0", registry = "thruput" }
thruput_indexer = { path = "thruput_indexer", version = "=0.54.0", registry = "thruput" }
thruput_db_gateway = { path = "thruput_db_gateway", version = "=0.54.0", registry = "thruput" }
thruput_view = { path = "thruput_view", version = "=0.54.0", registry = "thruput" }
hogexec-internal = { path = "hogexec-internal", version = "=0.54.0", registry = "thruput" }
thruput_spec = { path = "thruput_spec", version = "=0.54.0", registry = "thruput" }
xdrs = { registry = "thruput", version = "0.10.3", default-features = false, features = [
    "int128",
    "derive",
] }
xdr-common = { version = "0.10.3", registry = "thruput" }
xdr-derive = { version = "0.10.3", registry = "thruput" }
rpc_api = { version = "0.2", registry = "thruput" }
rpc_driver = { version = "0.11", registry = "thruput" }
schemars = { version = "1" }

[profile.dev]
opt-level = 3
overflow-checks = false
debug = false
strip = "none"
panic = "abort"
lto = true
codegen-units = 1

[profile.test]
# settings inherited from profile.dev
opt-level = 0
overflow-checks = true
debug = true
strip = "none"
debug-assertions = true

[profile.release]
opt-level = 3
overflow-checks = false
debug = false
strip = "symbols"
debug-assertions = false
panic = "abort"
lto = true
codegen-units = 1
# also see rust flags set in .cargo/config.toml
