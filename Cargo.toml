[workspace]
members = [
    "groundhog-xdr-macros",
    "groundhog-xdr",
    "groundhog_rpc",
    "groundhog_scp",
    "groundhog_coordinator",
    "groundhog-koordinator",
    "groundhog_hogx",
    "groundhog_indexer",
    "groundhog_scheduler",
    "groundhog_db_gateway",
    "bin/rpcthroughput_server",
    "groundhog_xdr_syscall_tests",
    "hogexec-internal",
    "groundhog-trace",
    "groundhog-spec",
]
resolver = "2"

[workspace.package]
version = "0.12.2"
edition = "2024"
authors = ["Groundhog Team"]
license = "Apache-2.0"
publish = ["groundhog"]
description = "Groundhog Protocol"
repository = "https://github.com/groundhogchain/protocol_rs.git"
homepage = "https://github.com/groundhogchain/protocol_rs.git"
keywords = ["groundhog"]
categories = ["blockchain"]

# These version numbers need to be kept in sync with the workspace package version number
[workspace.dependencies]
groundhog-xdr = { path = "groundhog-xdr", version = "=0.12.2", registry = "groundhog" }
groundhog-xdr-macros = { path = "groundhog-xdr-macros", version = "=0.12.2", registry = "groundhog" }
groundhog-trace = { path = "groundhog-trace", version = "=0.12.2", registry = "groundhog" }
groundhog_scp = { path = "groundhog_scp", version = "=0.12.2", registry = "groundhog" }
groundhog_coordinator = { path = "groundhog_coordinator", version = "=0.12.2", registry = "groundhog" }
groundhog-koordinator = { path = "groundhog-koordinator", version = "=0.12.2", registry = "groundhog" }
groundhog_hogx = { path = "groundhog_hogx", version = "=0.12.2", registry = "groundhog" }
groundhog_rpc = { path = "groundhog_rpc", version = "=0.12.2", registry = "groundhog" }
groundhog_indexer = { path = "groundhog_indexer", version = "=0.12.2", registry = "groundhog" }
groundhog_scheduler = { path = "groundhog_scheduler", version = "=0.12.2", registry = "groundhog" }
groundhog_db_gateway = { path = "groundhog_db_gateway", version = "=0.12.2", registry = "groundhog" }
hogexec-internal = { path = "hogexec-internal", version = "=0.12.2", registry = "groundhog" }
macros = { path = "macros", version = "=0.12.2", registry = "groundhog" }
groundhog-spec = { path = "groundhog-spec", version = "=0.12.2", registry = "groundhog" }

xdrs = { registry = "groundhog", version = "0.5.7", features = [
    "int128",
    "derive",
    "ns",
] }
rpc_driver = { version = "0.8", registry = "groundhog" }
xdr-common = { version = "0.5.0", registry = "groundhog" }
xdr-repr = { version = "0.5.0", registry = "groundhog" }
xdr-derive = { version = "0.5.0", registry = "groundhog" }
schemars = { version = "1" }
serde_with = { version = "3.16.1" }
serde_arrays = { package = "groundhog-serde_arrays", version = "0.2.0", registry = "groundhog", default-features = false }


[profile.dev]
opt-level = 3
overflow-checks = false
debug = false
strip = "none"
panic = "abort"
lto = true
codegen-units = 1

[profile.test]
# settings inherited from profile.dev
opt-level = 0
overflow-checks = true
debug = true
strip = "none"
debug-assertions = true

[profile.release]
opt-level = 3
overflow-checks = false
debug = false
strip = "symbols"
debug-assertions = false
panic = "abort"
lto = true
codegen-units = 1
# also see rust flags set in .cargo/config.toml
