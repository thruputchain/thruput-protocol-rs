[workspace]
members = [
    "hogexec-internal",
    "thruput-xdr-macros",
    "thruput-syscall",
    "thruput-xdr",
    "thruput-rpc",
    "thruput-scp",
    "thruput-coordinator",
    "thruput-akkad",
    "thruput-hogx",
    "thruput-trace",
    "thruput-scheduler",
    "thruput-indexer",
    "thruput-db-gateway",
    "thruput-view",
    "thruput-api-pins",
    "bin/rpcthroughput_server",
    "thruput-xdr-syscall-tests",
    "thruput-spec",
]
resolver = "2"

[workspace.package]
version = "0.56.4"
edition = "2024"
rust-version = "1.96"
authors = ["Thruput Team"]
license = "Apache-2.0"
publish = ["thruput"]
description = "Thruput Protocol"
repository = "https://github.com/thruputchain/thruput-protocol-rs.git"
homepage = "https://github.com/thruputchain/thruput-protocol-rs.git"
keywords = ["thruput"]
categories = ["blockchain"]

# These version numbers need to be kept in sync with the workspace package version number
[workspace.dependencies]
thruput-syscall = { path = "thruput-syscall", version = "=0.56.4", registry = "thruput" }
thruput-xdr = { path = "thruput-xdr", version = "=0.56.4", registry = "thruput" }
thruput-xdr-macros = { path = "thruput-xdr-macros", version = "=0.56.4", registry = "thruput" }
thruput-trace = { path = "thruput-trace", version = "=0.56.4", registry = "thruput" }
thruput-scp = { path = "thruput-scp", version = "=0.56.4", registry = "thruput" }
thruput-coordinator = { path = "thruput-coordinator", version = "=0.56.4", registry = "thruput" }
thruput-akkad = { path = "thruput-akkad", version = "=0.56.4", registry = "thruput" }
thruput-hogx = { path = "thruput-hogx", version = "=0.56.4", registry = "thruput" }
thruput-rpc = { path = "thruput-rpc", version = "=0.56.4", registry = "thruput" }
thruput-scheduler = { path = "thruput-scheduler", version = "=0.56.4", registry = "thruput" }
thruput-indexer = { path = "thruput-indexer", version = "=0.56.4", registry = "thruput" }
thruput-db-gateway = { path = "thruput-db-gateway", version = "=0.56.4", registry = "thruput" }
thruput-view = { path = "thruput-view", version = "=0.56.4", registry = "thruput" }
hogexec-internal = { path = "hogexec-internal", version = "=0.56.4", registry = "thruput" }
thruput-spec = { path = "thruput-spec", version = "=0.56.4", registry = "thruput" }
xdrs = { registry = "thruput", version = "0.12.0", default-features = false, features = [
    "int128",
    "derive",
] }
xdr-common = { version = "0.12.0", registry = "thruput" }
xdr-derive = { version = "0.12.0", registry = "thruput" }
rpc_api = { version = "0.3.0", registry = "thruput" }
rpc_driver = { version = "0.15", registry = "thruput" }
schemars = { version = "1" }

[profile.dev]
opt-level = 3
overflow-checks = false
debug = false
strip = "none"
panic = "abort"
lto = true
codegen-units = 1

[profile.test]
# settings inherited from profile.dev
opt-level = 0
overflow-checks = true
debug = true
strip = "none"
debug-assertions = true

[profile.release]
opt-level = 3
overflow-checks = false
debug = false
strip = "symbols"
debug-assertions = false
panic = "abort"
lto = true
codegen-units = 1
# also see rust flags set in .cargo/config.toml
