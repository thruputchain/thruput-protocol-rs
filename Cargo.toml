[workspace]
members = [
    "hogexec-internal",
    "thruput-xdr-macros",
    "thruput-syscall",
    "thruput-xdr",
    "thruput-rpc",
    "thruput-scp",
    "thruput-coordinator",
    "thruput-akkad",
    "thruput-trace",
    "thruput-scheduler",
    "thruput-indexer",
    "thruput-db-gateway",
    "thruput-view",
    "thruput-api-pins",
    "bin/rpcthroughput_server",
    "thruput-xdr-syscall-tests",
    "thruput-spec",
]
resolver = "2"

[workspace.package]
version = "0.60.0"
edition = "2024"
rust-version = "1.96"
authors = ["Thruput Team"]
license = "Apache-2.0"
publish = ["thruput"]
description = "Thruput Protocol"
repository = "https://github.com/thruputchain/thruput-protocol-rs.git"
homepage = "https://github.com/thruputchain/thruput-protocol-rs.git"
keywords = ["thruput"]
categories = ["blockchain"]

# These version numbers need to be kept in sync with the workspace package version number
[workspace.dependencies]
thruput-syscall = { path = "thruput-syscall", version = "=0.60.0", registry = "thruput" }
thruput-xdr = { path = "thruput-xdr", version = "=0.60.0", registry = "thruput" }
thruput-xdr-macros = { path = "thruput-xdr-macros", version = "=0.60.0", registry = "thruput" }
thruput-trace = { path = "thruput-trace", version = "=0.60.0", registry = "thruput" }
thruput-scp = { path = "thruput-scp", version = "=0.60.0", registry = "thruput" }
thruput-coordinator = { path = "thruput-coordinator", version = "=0.60.0", registry = "thruput" }
thruput-akkad = { path = "thruput-akkad", version = "=0.60.0", registry = "thruput" }
thruput-rpc = { path = "thruput-rpc", version = "=0.60.0", registry = "thruput" }
thruput-scheduler = { path = "thruput-scheduler", version = "=0.60.0", registry = "thruput" }
thruput-indexer = { path = "thruput-indexer", version = "=0.60.0", registry = "thruput" }
thruput-db-gateway = { path = "thruput-db-gateway", version = "=0.60.0", registry = "thruput" }
thruput-view = { path = "thruput-view", version = "=0.60.0", registry = "thruput" }
hogexec-internal = { path = "hogexec-internal", version = "=0.60.0", registry = "thruput" }
thruput-spec = { path = "thruput-spec", version = "=0.60.0", registry = "thruput" }
# Published on crates.io under thruput-* package names. The xdrs dependency keys
# keep the library names that the generated bindings and xdr-derive output use;
# the RPC crates' library names are their package names.
xdrs = { package = "thruput-xdrs", version = "0.17.0", default-features = false, features = [
    "int128",
    "derive",
] }
xdr-common = { package = "thruput-xdr-common", version = "0.17.0" }
xdr-derive = { package = "thruput-xdr-derive", version = "0.17.0" }
thruput-rpc-api = { version = "0.4.0" }
thruput-rpc-driver = { version = "0.17.1" }
schemars = { version = "1" }

# Build and test share one profile so `cargo build` and `cargo test` reuse
# the same dependency artifacts instead of compiling everything twice.
# Use --release for optimized binaries.
[profile.dev]
# On Linux, leave the DWARF in per-object .dwo files instead of copying it into
# every linked binary. Debuggers and backtraces still find it; macOS already
# defaults to this.
split-debuginfo = "unpacked"

# Dependencies keep file:line for backtraces; only stepping into their source
# in a debugger degrades. Workspace crates keep full debuginfo.
[profile.dev.package."*"]
debug = "line-tables-only"

# Build scripts and proc macros are build-time machinery nobody debugs.
[profile.dev.build-override]
debug = false

[profile.release]
opt-level = 3
overflow-checks = false
debug = false
strip = "symbols"
debug-assertions = false
panic = "abort"
lto = true
codegen-units = 1
# also see rust flags set in .cargo/config.toml
