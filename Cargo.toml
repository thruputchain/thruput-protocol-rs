[workspace]
members = [
    "groundhog-xdr",
    "groundhog_rpc",
    "groundhog_scp",
    "groundhog_coordinator",
    "groundhog_hogx",
    "bin/rpcthroughput_server",
    "macros",
    "groundhog_xdr_syscall_tests",
    "hogexec-internal",
    ]
resolver = "2"

[workspace.dependencies]
xdrs = { git = "ssh://git@github.com/groundhogchain/xdrs.git", features = ["extras", "int128_xdr", "derive", "ns"] }
rpc_driver = { git = "ssh://git@github.com/groundhogchain/xdr_rpc.git" }

[profile.dev]
opt-level = 3
overflow-checks = false
debug = false
strip = "none"
panic = "abort"
lto = true
codegen-units = 1

[profile.test]
# settings inherited from profile.dev
opt-level = 0
overflow-checks = true
debug = true
strip = "none"
debug-assertions = true

[profile.release]
opt-level = 3
overflow-checks = false
debug = false
strip = "symbols"
debug-assertions = false
panic = "abort"
lto = true
codegen-units = 1
# also see rust flags set in .cargo/config.toml
