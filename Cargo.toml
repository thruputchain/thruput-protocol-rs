[workspace]
members = [
    "groundhog-xdr-macros",
    "groundhog-xdr",
    "groundhog_rpc",
    "groundhog_scp",
    "groundhog_coordinator",
    "groundhog_hogx",
    "groundhog_scheduler",
    "bin/rpcthroughput_server",
    "groundhog_xdr_syscall_tests",
    "hogexec-internal",
    "groundhog-trace",
]
resolver = "2"

[workspace.package]
version = "0.3.2"
edition = "2024"
authors = ["Groundhog Team"]
license = "Apache-2.0"
publish = ["groundhog"]
description = "Groundhog Protocol"
repository = "https://github.com/groundhogchain/protocol_rs.git"
homepage = "https://github.com/groundhogchain/protocol_rs.git"
keywords = ["groundhog"]
categories = ["blockchain"]

# These version numbers need to be kept in sync with the workspace package version number
[workspace.dependencies]
groundhog-xdr = { path = "groundhog-xdr" }
groundhog-xdr-macros = { path = "groundhog-xdr-macros" }
groundhog-trace = { path = "groundhog-trace" }
groundhog_scp = { path = "groundhog_scp" }
groundhog_coordinator = { path = "groundhog_coordinator" }
groundhog_hogx = { path = "groundhog_hogx" }
groundhog_rpc = { path = "groundhog_rpc" }
groundhog_scheduler = { path = "groundhog_scheduler" }
hogexec-internal = { path = "hogexec-internal" }
macros = { path = "macros" }

xdrs = { path = "../xdrs", features = [
    "int128",
    "derive",
    "ns",
] }
rpc_driver = { path = "../xdr_rpc/rpc_driver" }
xdr-common = { path = "../xdrs/xdr-common" }
xdr-repr = { path = "../xdrs/xdr-repr" }
xdr-derive = { path = "../xdrs/xdr-derive" }
serde_with = { version = "3.16.1" }
serde_arrays = { package = "groundhog-serde_arrays", path = "../serde_arrays", default-features = false }


[profile.dev]
opt-level = 3
overflow-checks = false
debug = false
strip = "none"
panic = "abort"
lto = true
codegen-units = 1

[profile.test]
# settings inherited from profile.dev
opt-level = 0
overflow-checks = true
debug = true
strip = "none"
debug-assertions = true

[profile.release]
opt-level = 3
overflow-checks = false
debug = false
strip = "symbols"
debug-assertions = false
panic = "abort"
lto = true
codegen-units = 1
# also see rust flags set in .cargo/config.toml
