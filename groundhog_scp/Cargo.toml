[package]
name = "groundhog_scp"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["rlib"]

[features]
default = ["alloc", "std", "xdrs"]
alloc = ["xdrs", "xdrs/alloc"]
std = ["alloc"]
xdrs = []
spec = [] # enable dump of XDR specs
serde = [
    "dep:serde",
    "dep:serde_arrays",
    "xdrs/serde",
    "groundhog-xdr/serde",
]

[dependencies]
async-trait = "0.1.89"

[dependencies.serde]
optional = true
version = "1.0.219"
default-features = false
features = ["derive"]

[dependencies.serde_arrays]
optional = true
git = "ssh://git@github.com/groundhogchain/serde_arrays.git"
default-features = false

[dependencies.groundhog-xdr]
path = "../groundhog-xdr"
features = ["std", "xdrs"]

[dependencies.xdrs]
workspace = true
features = ["derive", "extras", "int128_xdr", "ns", "alloc"]

[dependencies.rpc_driver]
workspace = true
