[package]
name = "groundhog_rpc"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["rlib"]

[features]
default = ["alloc", "std", "xdrs"]
alloc = ["xdrs/alloc"]
std = ["alloc"]
xdrs = []
serde = ["dep:serde", "dep:serde_arrays", "xdrs/serde"]

[dependencies]
async-trait = "0.1.89"

[dependencies.serde]
optional = true
version = "1.0.219"
default-features = false
features = ["derive"]

[dependencies.serde_arrays]
optional = true
git = "ssh://git@github.com/groundhogchain/serde_arrays.git"
default-features = false

[dependencies.xdrs]
workspace = true
features = ["derive", "int128_xdr", "ns", "alloc"]

[dependencies.rpc_driver]
workspace = true

[dependencies.xdr-common]
workspace = true
