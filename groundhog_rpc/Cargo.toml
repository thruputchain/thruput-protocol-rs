[package]
name = "groundhog_rpc"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish = false
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description =  "Bindings for groundhog test rpcs"


[lib]
crate-type = ["rlib"]

[features]
default = ["alloc", "std", "xdrs"]
alloc = ["xdrs/alloc"]
std = ["alloc"]
xdrs = []
serde = ["dep:serde", "dep:serde_arrays", "dep:serde_with", "xdrs/serde"]

[dependencies]
async-trait = "0.1.89"

[dependencies.serde]
optional = true
version = "1.0.219"
default-features = false
features = ["derive"]

[dependencies.serde_arrays]
optional = true
workspace = true
default-features = false

[dependencies.serde_with]
workspace = true
optional = true
features = []

[dependencies.xdrs]
workspace = true
features = ["derive", "int128", "ns", "alloc"]

[dependencies.rpc_driver]
workspace = true

[dependencies.xdr-common]
workspace = true
