[package]
name = "thruput-rpc"
version.workspace = true
rust-version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish = false
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description =  "Bindings for Thruput test rpcs"

[lib]
crate-type = ["rlib"]

[features]
default = ["alloc", "std", "xdrs"]
alloc = ["xdrs/alloc"]
std = ["alloc"]
xdrs = []
serde = ["dep:serde", "xdrs/serde"]

[dependencies]
async-trait = "0.1.89"

[dependencies.schemars]
workspace = true

[dependencies.serde]
optional = true
version = "1.0.219"
default-features = false
features = ["derive"]

[dependencies.xdrs]
workspace = true
features = ["derive", "int128", "alloc", "schemars"]

[dependencies.rpc_api]
workspace = true

[dependencies.xdr-common]
workspace = true
