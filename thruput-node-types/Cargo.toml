[package]
name = "thruput-node-types"
description = "Thruput node types shared by the node RPC bindings: transaction batches, block proposals, consensus values and common RPC results"
version.workspace = true
rust-version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

# docs.rs builds the default features only; document the whole API.
[package.metadata.docs.rs]
all-features = true

[lib]
crate-type = ["rlib"]

[features]
default = ["alloc", "std"]
alloc = ["xdrs/alloc", "thruput-xdr/alloc"]
std = ["alloc"]
serde = [
    "dep:serde",
    "xdrs/serde",
    "thruput-xdr/serde",
]

[dependencies]
thruput-xdr = { workspace = true, features = ["std", "xdrs", "schema"] }
xdrs = { workspace = true, features = ["derive", "alloc", "schemars"] }
xdr-common = { workspace = true }

schemars = { workspace = true }
serde = { version = "1", features = ["derive"], optional = true }

[dev-dependencies]
serde_json = "1"
