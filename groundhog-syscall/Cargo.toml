[package]
name = "groundhog-syscall"
version.workspace = true
rust-version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Raw syscall dispatch ABI for the groundhog guest"

[lib]
crate-type = ["rlib"]

[features]
default = []
# Selects the native "C-unwind" mock import path (used by native_exec / syscall
# tests), making the dispatch layer available on a host target. Without it, a
# host build (no riscv32) has no dispatch path and the crate is empty.
syscalls_mock = []
