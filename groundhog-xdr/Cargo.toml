[package]
name = "groundhog-xdr"
version.workspace = true
rust-version.workspace = true
edition = "2024"
authors = ["Groundhog Team"]
license = "Apache-2.0"
publish.workspace = true
description = "Bindings for groundhog protocol structures"
repository = "https://github.com/groundhogchain/protocol_rs"
homepage = "https://github.com/groundhogchain/protocol_rs"
readme = "../README.md"
keywords = ["xdr", "blockchain", "groundhog"]
categories = ["blockchain"]
include = [
    "**/*.rs",
    "build.rs",
    "Cargo.toml",
    "docs/**/*.md",
    "src/syscalls.yaml",
    "syscalls_docs.json"
]

[lib]
crate-type = ["rlib"]

[features]
default = []
alloc = ["serde?/alloc", "serde_arrays?/alloc", "xdrs/alloc"]
std = ["alloc", "dep:thiserror"]
# Note that pulling in serde pulls in an allocator via xdrs/serde->xdr_common/serde->xdr_common/alloc
# Additionally, the serde_arrays::hex feature requires an allocator
serde = ["dep:serde", "dep:serde_arrays", "xdrs/serde", "serde_arrays/alloc"]
# `xdrs` deliberately does not imply `alloc`: rv32 contract builds use
# `xdrs` without an allocator for encoding and fixed-size decoding.
# Decoding variable-length types (VecM/BytesM/StringM) requires `alloc`;
# without it, the xdrs crate's no-alloc `ReadXDR` impls for those types
# panic with `unimplemented!()` at runtime. Enable `alloc` (or use the
# heapless containers from `xdrs`) anywhere such values are decoded.
xdrs = []
spec = ["std", "xdrs", "xdrs/repr"]
schema = ["dep:schemars", "xdrs/schemars", "std"]
syscalls = ["dep:groundhog-syscall"]
syscalls_mock = ["syscalls", "groundhog-syscall/syscalls_mock", "std"]   # required for native_exec integration

[dependencies.xdrs]
workspace = true
features = ["derive"]

[dependencies.serde]
optional = true
version = "1.0.219"
default-features = false
features = ["derive"]

[dependencies.serde_arrays]
optional = true
workspace = true
default-features = false

[dependencies.groundhog-syscall]
workspace = true
optional = true

[dependencies.groundhog-xdr-macros]
workspace = true

[dependencies.thiserror]
optional = true
version = "2.0.16"
default-features = false

[dependencies.schemars]
workspace = true
optional = true

[dependencies.xdr-common]
workspace = true

[dev-dependencies.xdrs]
workspace = true
features = ["alloc"]

[[test]]
name = "syscall_no_display"
required-features = ["std"]

[[test]]
name = "roundtrip"
required-features = ["std", "xdrs"]
