[package]
name = "groundhog-xdr"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["rlib"]

[features]
default = []
alloc = ["serde?/alloc", "serde_arrays?/alloc", "xdrs/alloc"]
std = ["alloc"]
# Note that pulling in serde pulls in an allocator via xdrs/serde->xdr_common/serde->xdr_common/alloc
serde = ["dep:serde", "dep:serde_arrays", "xdrs/serde"]
xdrs = []
spec = ["std", "xdrs", "xdrs/repr"]
syscalls = ["dep:groundhog_xdr_macros", "dep:thiserror"]
syscalls_mock = ["syscalls"] # required for native_exec integration

[dependencies.xdrs]
workspace = true
features = ["derive"]

[dependencies.serde]
optional = true
version = "1.0.219"
default-features = false
features = ["derive"]

[dependencies.serde_arrays]
optional = true
git = "ssh://git@github.com/groundhogchain/serde_arrays.git"
default-features = false

[dependencies.groundhog_xdr_macros]
path = "../macros"
optional = true

[dependencies.thiserror]
optional = true
version = "2.0.16"
default-features = false
