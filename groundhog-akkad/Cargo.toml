[package]
name = "groundhog-akkad"
version.workspace = true
rust-version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Bindings for groundhog Akkad coordinator rpcs"

[lib]
crate-type = ["rlib"]

[features]
default = ["alloc", "std"]
alloc = ["xdrs/alloc"]
std = ["alloc"]
serde = [
    "dep:serde",
    "dep:serde_arrays",
    "xdrs/serde",
    "groundhog_scp/serde",
    "groundhog-xdr/serde",
]

[dependencies]
async-trait = "0.1.89"

[dependencies.schemars]
workspace = true

[dependencies.serde]
optional = true
version = "1.0.219"
default-features = false
features = ["derive"]

[dependencies.serde_arrays]
optional = true
workspace = true
default-features = false

[dependencies.groundhog_scp]
workspace = true
features = ["std"]

[dependencies.groundhog-xdr]
workspace = true
features = ["std", "xdrs", "schema"]

[dependencies.xdrs]
workspace = true
features = ["derive", "alloc", "schemars"]

[dependencies.rpc_api]
workspace = true
